<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141A26">
<title>Mecha-Pof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Mecha-Pof-stijl: donkere werkplaats met rasterlijnen, gietijzeren panelen met klinknagels, cyaan LED-licht, pannenkoekgoud voor de knoppen.
   Eén vaste balk bovenin, daaronder één scherm dat horizontaal inschuift.
   Schermen: boot, login, lobby, nav (onderweg), puz (puzzel/finale), klaar. Overlays: viering, missie, begeleider. */
:root{
  --bg:#141A26; --bg2:#1C2433; --grid:rgba(60,74,102,.45);
  --panel:#252C3A; --panel2:#1A1F2A; --line:#3C4A66; --line2:#4E5D7E;
  --steel:#C9D3E0; --steel-dark:#8E979F;
  --visor:#0E1B2E; --led:#7FE8FF; --led-dark:#15A4C8; --led-soft:rgba(127,232,255,.16);
  --gold:#F2BE62; --gold-dark:#C9792C; --gold-deep:#9A5419;
  --ink:#EAF2FF; --muted:#93A0B8; --straw:#FF5A4E; --ok:#4ADE80; --ok-dark:#1F8A4C; --flame:#F59E2E;
  --acc:var(--led);
  --display:'Lilita One','Arial Rounded MT Bold','Arial Black',sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --hud:'Chakra Petch',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--body);font-weight:600;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none;overflow-x:hidden}
/* werkplaats: vaste achtergrond (iOS kent geen background-attachment:fixed) */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(120% 90% at 50% 25%,#33405A 0%,var(--bg) 70%)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.1;margin:0;color:var(--ink);text-wrap:balance}
h1{font-size:2.2rem;color:var(--gold);text-shadow:0 3px 0 var(--gold-deep),0 0 24px rgba(242,190,98,.25)}h2{font-size:1.6rem}h3{font-size:1.15rem;color:var(--led);font-family:var(--hud);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}
p{margin:0}
b,strong{color:#fff}
button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:14px;min-height:56px;padding:12px 18px;color:#3A1C06;
  background:linear-gradient(180deg,#FCE3A6 0%,var(--gold) 45%,#E0A548 100%);
  box-shadow:0 4px 0 var(--gold-deep),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep),inset 0 1px 0 rgba(255,255,255,.6)}
button:focus-visible,input:focus-visible{outline:3px solid var(--led);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.ok{background:linear-gradient(180deg,#86F0AE 0%,var(--ok) 50%,#2FBF66 100%);color:#062814;box-shadow:0 4px 0 var(--ok-dark),0 0 18px rgba(74,222,128,.25),inset 0 1px 0 rgba(255,255,255,.5)}
button.ok:active{box-shadow:0 1px 0 var(--ok-dark)}
button.berry{background:linear-gradient(180deg,#C8F6FF 0%,var(--led) 50%,#3FC9EA 100%);color:var(--visor);box-shadow:0 4px 0 #0E6F8A,0 0 18px rgba(127,232,255,.3),inset 0 1px 0 rgba(255,255,255,.6)}
button.berry:active{box-shadow:0 1px 0 #0E6F8A}
button.plain{background:linear-gradient(180deg,#3A4356,#2A3142);color:var(--ink);border:2px solid var(--line2);box-shadow:0 3px 0 #10141C,inset 0 1px 0 rgba(255,255,255,.08)}
button.plain:active{box-shadow:0 1px 0 #10141C}
button.ghost{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline;min-height:44px;padding:8px 10px;font-weight:800}
button.ghost:active{transform:none}
button.danger{background:var(--panel2);color:var(--straw);border:2px solid #7A2A26;box-shadow:0 3px 0 #10141C}
button.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}.grow{flex:1}
.center{text-align:center}
.note{font-size:.88rem;color:var(--muted)}
.eyebrow{font-family:var(--hud);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--led);font-weight:700}
input.big{font:inherit;font-family:var(--hud);font-weight:700;font-size:1.8rem;text-align:center;letter-spacing:.3em;width:100%;min-height:60px;border:2px solid var(--led-dark);border-radius:14px;padding:8px 12px;
  background:linear-gradient(180deg,var(--visor),#1E3352);color:var(--led);text-shadow:0 0 10px rgba(127,232,255,.6);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
input.big::placeholder{letter-spacing:.08em;font-family:var(--body);font-weight:800;font-size:1.05rem;color:#4F6A8C;text-shadow:none}
input.big:focus{border-color:var(--led);box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 0 4px var(--led-soft)}

/* ---------- balk */
#bar{position:sticky;top:0;z-index:10;background:rgba(20,26,38,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);
  box-shadow:0 1px 0 rgba(127,232,255,.18);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
#bar .in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px}
#bar .chips{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--ink);border:2px solid var(--acc);border-radius:999px;padding:3px 10px 3px 4px;font-weight:900;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}
.chip i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:13px;flex:none}
.drops{font-family:var(--hud);font-weight:700;color:var(--gold);font-size:1.05rem;white-space:nowrap}
.conn{width:16px;height:20px;flex:none}
.iconbtn{min-height:40px;width:40px;padding:0;border-radius:12px;background:linear-gradient(180deg,#3A4356,#2A3142);color:var(--ink);border:2px solid var(--line2);box-shadow:none;font-size:18px;display:grid;place-items:center}
.parts{display:flex;gap:5px;justify-content:center;max-width:540px;margin:6px auto 0}
.part{width:30px;height:30px;border-radius:50%;background:var(--visor);border:2px dashed var(--line2);display:grid;place-items:center;font-size:15px}
.part.got{background:radial-gradient(circle at 40% 35%,#1E3352,var(--visor));border:2px solid var(--led);box-shadow:0 0 10px rgba(127,232,255,.55);animation:pop .45s}

/* ---------- schermen */
#screen{max-width:540px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scr{display:flex;flex-direction:column;gap:16px}
.slide-in{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes led{0%,55%{opacity:1}56%,100%{opacity:.3}}
/* paneel van gietijzer met vier klinknagels; het tabje is een HUD-label */
.page{position:relative;color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:26px 18px 18px;display:flex;flex-direction:column;gap:12px;margin-top:14px;
  background:
    radial-gradient(circle at 12px 12px,#9AA3AD 0 2.5px,#4A5058 3px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 12px) 12px,#9AA3AD 0 2.5px,#4A5058 3px,transparent 3.6px),
    radial-gradient(circle at 12px calc(100% - 12px),#9AA3AD 0 2.5px,#4A5058 3px,transparent 3.6px),
    radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),#9AA3AD 0 2.5px,#4A5058 3px,transparent 3.6px),
    linear-gradient(160deg,var(--panel) 0%,var(--panel2) 100%);
  box-shadow:0 6px 0 #0B0E15,0 14px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.page>.tab{position:absolute;top:-14px;left:18px;background:var(--visor);color:var(--led);font-family:var(--hud);font-weight:700;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 12px 4px 26px;border:2px solid var(--led-dark);border-radius:8px;box-shadow:0 0 12px rgba(127,232,255,.25)}
.page>.tab::before{content:'';position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);animation:led 1.4s steps(1) infinite}
.page.acc{border-left:8px solid var(--acc)}
.stamp{position:absolute;top:12px;right:16px;transform:rotate(8deg);border:3px solid var(--straw);color:var(--straw);font-family:var(--hud);font-weight:700;font-size:.9rem;letter-spacing:.14em;padding:1px 8px;border-radius:6px;opacity:.9;text-shadow:0 0 8px rgba(255,90,78,.5)}
.monster{display:flex;justify-content:center}
.monster svg{width:min(66vw,250px);height:auto}
.monster.lg svg{width:min(80vw,320px)}
.monster.md svg{width:min(62vw,240px)}
.mslot{display:flex;justify-content:center;min-height:40px;position:relative}
.mslot[data-size=md],.mslot[data-size=lg]{background:radial-gradient(closest-side,rgba(127,232,255,.14),transparent 70%)}
.monster.sm svg{width:110px}
.monster.sleep svg{filter:grayscale(1) opacity(.7)}

/* ---------- lobby */
.guards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guard{--acc:var(--line);background:var(--visor);border:2px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;min-height:56px}
.guard.mine{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent),0 0 16px color-mix(in srgb,var(--acc) 30%,transparent)}
.guard .ic{font-size:1.4rem;flex:none}
.guard b{display:block;font-weight:900;line-height:1.15}
.guard small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4A5058;margin-left:5px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.talent{background:var(--visor);border:1px solid var(--line);border-left:4px solid var(--led);border-radius:12px;padding:10px 12px}

/* ---------- onderweg */
.clue{font-size:1.2rem;font-weight:800;line-height:1.38}
.dist{font-family:var(--hud);font-weight:700;font-size:3.4rem;color:var(--led);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(127,232,255,.55)}
.dist small{font-size:1.15rem;color:var(--muted);font-family:var(--hud);font-weight:700;text-shadow:none}
.meter{position:relative;height:20px;border-radius:999px;background:var(--visor);overflow:hidden;border:2px solid var(--line2);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--led-dark),var(--led) 40%,var(--flame) 75%,var(--straw));border-radius:999px;transition:width .6s;box-shadow:0 0 12px rgba(127,232,255,.5)}
.meter::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(14,27,46,.75) 14px 17px);pointer-events:none}
.status{font-size:.9rem;color:var(--muted);font-weight:800}
.status.bad{color:var(--straw)}
.mapwrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--led-dark);background:var(--visor);box-shadow:0 0 18px rgba(127,232,255,.18)}
.mapbtn{position:absolute;right:10px;bottom:24px;z-index:2;width:46px;min-height:46px;border-radius:50%;padding:0;font-size:20px}

/* ---------- puzzels (gedeeld door js/puzzles/*.js) */
.question{font-size:1.25rem;font-weight:900;line-height:1.35}
.feedback{font-weight:900;color:var(--straw);min-height:1.4em}
.feedback.ok{color:var(--ok);text-shadow:0 0 10px rgba(74,222,128,.4)}
.tries{margin:0;padding:0;list-style:none;display:flex;gap:6px;flex-wrap:wrap}
.tries li{background:rgba(255,90,78,.14);color:var(--straw);border-radius:8px;padding:2px 8px;font-size:.85rem;text-decoration:line-through}
.choices{display:grid;gap:10px}
.choices button{background:var(--visor);color:var(--ink);box-shadow:0 3px 0 #0B0E15;border:2px solid var(--line2);text-align:left}
.choices button.wrong{border-color:var(--straw);color:var(--straw);opacity:1;animation:shake .4s}
.choices button.right{border-color:var(--ok);background:rgba(74,222,128,.14);opacity:1;box-shadow:0 0 14px rgba(74,222,128,.3)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pimg{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:2px solid var(--line2);cursor:zoom-in}
.memo{display:grid;gap:8px}
.mcard{aspect-ratio:1;min-height:0;padding:0;border-radius:12px;font-size:1.8rem;display:grid;place-items:center}
.mcard .face{transition:transform .25s;transform:scale(.6);opacity:.5;filter:grayscale(1)}
.mcard.up{background:var(--visor);border:2px solid var(--led-dark);box-shadow:0 3px 0 #0B0E15,0 0 12px rgba(127,232,255,.25)}
.mcard.up .face{transform:none;opacity:1;filter:none}
.mcard.done{background:rgba(74,222,128,.14);border-color:var(--ok);box-shadow:0 3px 0 #0B0E15,0 0 12px rgba(74,222,128,.3)}
.slide{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(100%,300px);margin:0 auto;aspect-ratio:1;background:var(--visor);border:2px solid var(--line2);padding:4px;border-radius:12px}
.slide.solved{gap:0;border-color:var(--ok);box-shadow:0 0 18px rgba(74,222,128,.35)}
.stile{min-height:0;padding:0;border-radius:8px;background-size:300% 300%;background-color:#FFF4DF;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.stile.empty{background:#0A1322;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.big-btn{min-height:64px;font-size:1.15rem}
.hint{background:var(--visor);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;font-weight:800}
.submit{border-top:2px dashed var(--line2);padding-top:12px;display:flex;flex-direction:column;gap:8px}

/* ---------- overlays */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(8,11,18,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;padding:max(20px,env(safe-area-inset-top,0px)) 18px max(20px,env(safe-area-inset-bottom,0px));overflow:auto}
.overlay .page{margin:auto;width:100%;max-width:420px;align-items:center;text-align:center;animation:pop .45s}
.overlay .page.left{align-items:stretch;text-align:left}
.bubble{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:25;width:min(92vw,460px);background:var(--visor);color:var(--ink);border:2px solid var(--led);
  border-radius:18px 18px 18px 4px;padding:12px 14px 12px 56px;font-weight:800;box-shadow:0 0 20px rgba(127,232,255,.3),0 8px 24px rgba(0,0,0,.4);animation:slidein .3s}
.bubble::before{content:'🤖';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:30px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
#toast div{background:var(--visor);color:var(--ink);border:1px solid var(--led-dark);border-radius:12px;padding:10px 14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:slidein .25s}
.zoomov{position:fixed;inset:0;background:rgba(8,11,18,.95);z-index:45;display:grid;place-items:center;padding:12px}
.zoomov img{max-width:100%;max-height:100%;border-radius:10px}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;margin:6px 0}
.stack i{display:block;height:12px;border-radius:50%;background:var(--gold);border-bottom:3px solid var(--gold-dark);box-shadow:0 0 10px rgba(242,190,98,.25);animation:pop .4s backwards}
.tray section{display:flex;flex-direction:column;gap:8px;width:100%}
.tray .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tray button{min-height:50px;font-size:.95rem}
.tray label{display:flex;gap:10px;align-items:center;font-weight:800}
.tray input[type=checkbox]{width:24px;height:24px;accent-color:var(--led)}
.stoprow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.stoprow .num{width:28px;height:28px;border-radius:50%;background:var(--visor);border:2px solid var(--led-dark);color:var(--led);display:grid;place-items:center;font-family:var(--hud);font-weight:700;flex:none}
.stoprow small{display:block;color:var(--muted);font-size:.78rem}
.stoprow button{min-height:46px;padding:8px 10px;white-space:nowrap}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="bar"></header>
<main id="screen" aria-live="polite"></main>
<div id="toast" role="status"></div>
<canvas id="confetti" hidden></canvas>
<script type="module">
import { state, PARTS, TALENTS } from './js/state.js';
import { sync } from './js/sync.js';
import { createMap } from './js/map.js?v=5'; // ?v ophogen bij elke wijziging: GitHub Pages en Safari bewaren oude bestanden
import { createMonster, monsterImage, isSpeakerPhone } from './js/monster.js?v=10'; // ook ophogen bij wijzigingen in monster-lines.js / audio.js (en dan ook de ?v in monster.js)
import { openWalkie } from './js/walkie.js?v=9'; // walkietalkie met het live monster (ElevenLabs, zie MONSTER-AGENT.md)
import { audio } from './js/audio.js?v=7'; // zelfde ?v als in monster.js, anders laadt audio.js twee keer

/* ================================================================ hulpjes */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const qs = new URLSearchParams(location.search);
if (qs.has('test')) store.set('pkm2_test', qs.get('test') !== '0');
let test = store.get('pkm2_test', false);
let muted = store.get('pkm2_muted', false);
const S = () => state.get();
function haversine(a, b) { const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); }
function guard(p) { // naam, deel, talent en kleur van een bewaker
  const t = TALENTS[p?.talent], part = p?.part || t?.part;
  return { talent: t?.label || null, part, icon: PARTS[part]?.icon || (p?.is_birthday ? '🎂' : '🕵️'), color: p?.color || PARTS[part]?.color || '#5B6680' };
}
const stopNo = st => { const r = state.route(); return { n: r.findIndex(x => x.id === st.id) + 1, total: r.length }; };
const radiusOf = st => st.radius || S().game?.settings?.radius || 20;
const keyHolder = () => S().players.find(p => p.talent === 'sleutelbewaarder');
const canSubmit = () => state.hasTalent('sleutelbewaarder') || !!S().game?.settings?.any_can_submit;
const birthday = () => S().players.find(p => p.is_birthday);

/* ================================================================ geluid, trilling, toast, ballon
   Geluid: js/audio.js (audio.play('naam'); ontgrendelt zelf bij de eerste tik en volgt de dempknop pkm2_muted).
   Het monster praat en tekent zijn eigen ballon: js/monster.js. */
// Trillen: Android heeft navigator.vibrate; Safari op iPhone niet. Daar geeft een verborgen schakelaar (iOS 18+) een tikje,
// maar alleen direct na een tik van het kind zelf. Een patroon wordt een reeks tikjes.
function haptic() {
  try { const l = document.createElement('label'); l.ariaHidden = 'true'; l.style.display = 'none';
    const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i);
    document.head.appendChild(l); l.click(); l.remove(); } catch {}
}
addEventListener('click', e => { if (e.isTrusted && e.target.closest('button') && !navigator.vibrate) haptic(); }, { capture: true }); // tikje bij elke knop
function buzz(p) {
  if (navigator.vibrate) { try { navigator.vibrate(p); } catch {} return; }
  const n = Array.isArray(p) ? Math.ceil(p.length / 2) : 1;
  for (let k = 0; k < Math.min(n, 4); k++) setTimeout(haptic, k * 140);
}
function toast(text, ms = 3200) { const d = document.createElement('div'); d.textContent = text; $('#toast').appendChild(d); setTimeout(() => d.remove(), ms); }
function bubble(text, ms = 6000) { // tekstballon bovenin (reserve als het monster zelf geen ballon tekent)
  document.querySelector('.bubble')?.remove();
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text; b.onclick = () => b.remove();
  document.body.appendChild(b); setTimeout(() => b.remove(), ms); audio.play('brom');
}
const say = (text, opts) => mon.say(text, opts); // het monster praat; zie het monster-blok hieronder
function confetti() {
  const c = $('#confetti'), ctx = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ['#F2BE62', '#7FE8FF', '#FF5A4E', '#FFE98A', '#4ADE80'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height, r: 4 + Math.random() * 6, s: 2 + Math.random() * 3, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let t = 0; const step = () => { ctx.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.s; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (++t < 260) requestAnimationFrame(step); else c.hidden = true; }; requestAnimationFrame(step);
}

/* ================================================================ monster (js/monster.js: Zdog, stemmingen, landen, praten) */
const monsterUrl = () => monsterImage(); // stilstaand plaatje van het complete monster, voor de schuifpuzzel

/* Het monster-contract (js/monster.js levert precies deze vorm):
     createMonster() → { el,                          // één element; de app verhuist het tussen de schermen
       setParts(parts, { land }),                     // land = deel dat net gevonden is → landingsanimatie
       setMood(mood),                                 // 'slaap' | 'wakker' | 'nieuwsgierig' | 'brutaal' | 'compleet'
       setSize(size),                                 // 'sm' | 'md' | 'lg'
       say(text, { ms, voice }) → Promise,            // ballon + stem + bewegende mond
       react(kind),                                   // 'start' | 'goed' | 'fout' | 'hint' | 'tik'
       destroy() }
     monsterImage(parts?) → data-URL                 // stilstaand plaatje, voor de schuifpuzzel
   Schermen zetten alleen <div class="mslot" data-size="sm|md|lg"></div> neer; placeMonster() hangt het monster in de bovenste. */
const mon = createMonster();
let walkie = null; // open walkietalkie (js/walkie.js) of null
function moodFor() {
  const g = S().game, n = g?.parts?.length || 0;
  if (!g || g.phase === 'lobby') return 'slaap';
  if (g.phase === 'klaar') return 'compleet';
  return n <= 2 ? 'wakker' : n <= 4 ? 'nieuwsgierig' : 'brutaal';
}
function placeMonster() {
  if (walkie?.open) return; // de walkietalkie heeft het monster even te leen
  const slot = $('#ov .mslot') || $('#screen .mslot');
  if (!slot) { mon.el.remove(); return; }
  if (mon.el.parentNode !== slot) slot.appendChild(mon.el);
  mon.setSize(slot.dataset.size || 'md');
  if (!slot.dataset.parts) { mon.setParts(S().game?.parts || []); mon.setMood(moodFor()); }
}
const mslot = (size = 'md', extra = '') => `<div class="mslot" data-size="${size}" ${extra}></div>`;

/* ================================================================ event-router
   Elk event uit de tabel `event` dat binnenkomt ná het laden gaat één keer langs de handlers.
   Latere modules (surprises.js, badges.js, monster.js) haken in met pkm.router.on(type, fn). */
const handlers = {}, seen = new Set(); let primed = false;
const router = {
  on(type, fn) { (handlers[type] ||= []).push(fn); return () => handlers[type] = handlers[type].filter(f => f !== fn); },
  dispatch(ev) { for (const fn of [...(handlers[ev.type] || []), ...(handlers['*'] || [])]) { try { fn(ev.payload || {}, ev); } catch (e) { console.error('[router]', ev.type, e); } } },
};
state.on('event', ev => { if (!ev || seen.has(ev.id)) return; seen.add(ev.id); if (primed) router.dispatch(ev); });

router.on('game.start', () => { celebrate = null; overlay(`<div class="page"><span class="tab">Systeem opgestart</span>${mslot('lg')}<h2>Mecha-Pof wordt wakker…</h2><p>Zoek de eerste plek. Het monster kijkt mee.</p></div>`, 2600); mon.setMood('wakker'); mon.react('start'); audio.play('start'); buzz([80, 60, 120]); });
router.on('game.reset', () => { celebrate = null; closeOverlay(); toast('Het spel is opnieuw klaargezet.'); });
router.on('stop.arrived', () => { audio.play('aankomst'); buzz([80, 40, 80]); });
router.on('stop.solved', p => {
  const st = state.stop(p.stop_id); celebrate = { part: p.part, last: st?.key === 'home', by: p.by };
  audio.play('deel'); buzz([60, 40, 60, 40, 120]); if (celebrate.last) confetti(); showCelebrate();
});
router.on('hint.given', p => { audio.play('hint'); if (p.text) say(p.text, 9000); else toast('💡 Er is een hint vrijgegeven.'); });
router.on('monster.say', p => say(p.text || '…'));
router.on('roles.shuffle', () => { say('Ik heb de rollen geschud. Kijk maar eens wat je nu kunt.'); buzz([40, 40, 40]); });
router.on('plan_b', () => say('Eén telefoon is in slaap gevallen. Ik verdeel de talenten opnieuw.'));
router.on('gps.skip', p => { if (p.stop_id === state.activeStop()?.id && sync.isLoggedIn()) arrive(p.stop_id); });
router.on('badge.awarded', p => { const me = state.me().find(x => x.id === p.player_id); if (me) toast(`🏅 ${me.name} krijgt de badge ${p.badge}!`); });

/* ================================================================ walkietalkie (js/walkie.js)
   Per groep één walkietalkie: alleen de spreektelefoon (die ook hardop praat) krijgt de knop. */
function speakerNames() {
  const ps = S().players || [], ids = [...new Set(ps.filter(p => p.online && p.device_id).map(p => p.device_id))].sort();
  return ps.filter(p => p.device_id === ids[0]).map(p => p.name).join(' & ');
}
function walkieContext() {
  const g = S().game || {}, st = state.activeStop(), route = state.route(), got = g.parts || [];
  const cfg = st?.puzzles?.[S().puzzle?.variant ?? 0] || st?.puzzles?.[0] || {};
  return {
    jarige: birthday()?.name || 'de jarige',
    spelers: (S().players || []).map(p => p.name).join(', '),
    fase: { lobby: 'nog niet begonnen', onderweg: 'onderweg naar de volgende plek', puzzel: 'bij een puzzel', finale: 'bijna thuis, de finale', klaar: 'klaar, alles gevonden' }[g.phase] || g.phase || '',
    stop_naam: st?.name || '', stop_nummer: st ? route.indexOf(st) + 1 : '', stops_totaal: route.length || '',
    aanwijzing: st?.clue || '',
    puzzel_vraag: g.phase === 'puzzel' ? (cfg.question || '') : '',
    puzzel_hint: g.phase === 'puzzel' ? (cfg.hint || '') : '',
    delen_gevonden: got.map(k => PARTS[k]?.label || k).join(', ') || 'nog niks',
    delen_nog: Object.keys(PARTS).filter(k => !got.includes(k)).map(k => PARTS[k].label).join(', ') || 'niks meer',
    hints_gebruikt: g.hints ?? 0,
  };
}
function startWalkie() {
  if (walkie?.open) return;
  walkie = openWalkie({ mon, context: walkieContext, onClose: () => { walkie = null; placeMonster(); } });
}
// Wat er in het spel gebeurt, hoort het monster ook (zonder dat het hoeft te antwoorden).
router.on('*', (p, ev) => {
  if (!walkie?.open) return;
  const t = {
    'stop.arrived': () => `De kinderen zijn aangekomen bij ${state.stop(p.stop_id)?.name || 'de volgende plek'}. Er staat nu een puzzel klaar.`,
    'stop.solved': () => `De kinderen hebben de puzzel opgelost en ${PARTS[p.part]?.label || 'een deel'} gevonden!`,
    'hint.given': () => `Er is een hint gegeven${p.text ? ': ' + p.text : ''}.`,
    'game.start': () => 'Het spel is net begonnen.',
  }[ev.type];
  if (t) walkie.update(t());
});

/* ================================================================ begeleider (regiesleutel; chat 8 bouwt het echte regie.html) */
function openTray() {
  if (!sync.regie.restore()) {
    const o = overlay(`<div class="page left tray"><span class="tab">Begeleider</span><h2>Regiesleutel</h2>
      <form class="row" autocomplete="off"><input class="big grow" type="password" placeholder="sleutel" aria-label="Regiesleutel" style="letter-spacing:.05em;font-size:1.2rem"><button class="berry" type="submit">OK</button></form>
      <p class="feedback"></p><button class="ghost">Sluiten</button></div>`);
    $('input', o).focus();
    $('button.ghost', o).onclick = closeOverlay;
    $('form', o).onsubmit = async e => { e.preventDefault(); try { await sync.regie.login($('input', o).value.trim()); openTray(); } catch (err) { $('.feedback', o).textContent = err.message || 'Verkeerde sleutel'; } };
    return;
  }
  const g = S().game || {}, act = state.activeStop();
  const o = overlay(`<div class="page left tray"><span class="tab">Begeleider</span>
    <h2>Regie</h2><p class="note">Fase: <b>${esc(g.phase)}</b>${act ? ` · actieve stop: <b>${esc(act.name)}</b>` : ''} · telefoons online: ${state.phones()}</p>
    <section><h3>Spel</h3><div class="grid2"><button class="ok" data-r="start">▶ Start (schudt route)</button><button class="danger" data-r="reset">↺ Reset</button></div></section>
    <section><h3>Huidige stop</h3><div class="grid2"><button class="plain" data-r="skip">📡 GPS overslaan</button><button class="plain" data-r="hint">💡 Hint geven</button></div>
      <button data-r="approve">✅ Stop goedkeuren (+10)</button></section>
    <section><h3>Testen</h3>
      <label><input type="checkbox" data-r="test" ${test ? 'checked' : ''}> Testmodus op deze telefoon (teleportknop, geen GPS)</label>
      <label><input type="checkbox" data-r="any" ${g.settings?.any_can_submit ? 'checked' : ''}> Iedereen mag indienen (niet alleen de Sleutelbewaarder)</label>
      <button class="plain" data-r="deal">🎲 Talenten loten (test)</button></section>
    <section><h3>Plekken vastleggen</h3>
      <p class="note">Sta op de plek, wacht tot de GPS rustig is en tik op 📍. Opeenvolgende plekken liefst ${g.settings?.min_gap || 150} m uit elkaar.</p>
      <div id="stoplist">${stopRows()}</div></section>
    <div class="row"><button class="ghost" data-r="logout">Regie afmelden</button><span class="grow"></span><button class="plain" data-r="close">Sluiten</button></div></div>`);
  const busy = async (fn, ok) => { try { await fn(); if (ok) toast(ok); } catch (e) { toast('⚠️ ' + (e.message || e)); } };
  o.addEventListener('click', async e => {
    const r = e.target.closest('[data-r]')?.dataset.r; if (!r || e.target.type === 'checkbox') return;
    if (r === 'close') closeOverlay();
    else if (r === 'logout') { sync.regie.logout(); closeOverlay(); }
    else if (r === 'start') { closeOverlay(); await busy(() => sync.regie.start()); }
    else if (r === 'reset') { if (confirm('Spel terugzetten naar de lobby? Voortgang gaat verloren.')) { closeOverlay(); await busy(() => sync.regie.reset(false)); } }
    else if (r === 'skip') { closeOverlay(); await busy(() => sync.regie.event('gps.skip', { stop_id: state.activeStop()?.id }), 'GPS overgeslagen'); }
    else if (r === 'hint') { const t = prompt('Hint-tekst (leeg = de hint van de puzzel)'); if (t !== null) { closeOverlay(); await busy(() => sync.regie.hint(t.trim() || null)); } }
    else if (r === 'approve') { closeOverlay(); await busy(() => sync.regie.approveStop(10)); }
    else if (r === 'here') await placeStop(e.target.closest('[data-id]').dataset.id, o);
    else if (r === 'edit') await editStop(e.target.closest('[data-id]').dataset.id, o);
    else if (r === 'deal') {
      const keys = Object.keys(TALENTS).sort(() => Math.random() - .5), talents = {};
      S().players.forEach((p, i) => talents[p.id] = keys[i % keys.length]);
      await busy(() => sync.regie.event('roles.shuffle', { talents }), 'Talenten verdeeld');
    }
  });
  o.addEventListener('change', async e => {
    const r = e.target.dataset.r;
    if (r === 'test') { test = e.target.checked; store.set('pkm2_test', test); if (test) stopGps(); else if (inGame()) startGps(); refresh(true); }
    if (r === 'any') await busy(() => sync.regie.patchGame({ settings: { any_can_submit: e.target.checked } }), e.target.checked ? 'Iedereen mag indienen' : 'Alleen de Sleutelbewaarder');
  });
}

/* ---------- plekken vastleggen: huidige GPS naar de stop (regie_upsert_stop stuurt de hele stop mee) */
function stopRows() {
  const all = S().stops, gap = S().game?.settings?.min_gap || 150;
  return all.map(st => {
    const near = all.filter(x => x.id !== st.id).map(x => ({ x, d: haversine(st, x) })).sort((a, b) => a.d - b.d)[0];
    const warn = near && near.d < gap && st.key !== 'home' && near.x.key !== 'home';
    return `<div class="stoprow" data-id="${st.id}"><span class="num">${st.key === 'home' ? '🏠' : st.key === 'start' ? 'S' : st.seq}</span>
      <div class="grow"><b>${esc(st.name)}</b> ${PARTS[st.part]?.icon || ''}<small>${near ? `${warn ? '⚠️ ' : ''}${Math.round(near.d)} m tot ${esc(near.x.name)}` : ''}</small></div>
      <button class="plain" data-r="edit" aria-label="Naam en aanwijzing">✏️</button><button class="ok" data-r="here">📍 Hier</button></div>`;
  }).join('');
}
function gpsOnce() {
  return new Promise((res, rej) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? 'Locatie geweigerd' : 'Geen GPS-fix, probeer het buiten nog eens')), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }) : rej(new Error('Geen GPS')));
}
async function placeStop(id, o) {
  const st = state.stop(id); if (!st) return;
  const btn = $(`[data-id="${id}"] [data-r=here]`, o); btn.disabled = true; btn.textContent = '…';
  try {
    const c = await gpsOnce();
    if (c.accuracy > 25 && !confirm(`De GPS is nog onnauwkeurig (±${Math.round(c.accuracy)} m). Toch opslaan? (Even wachten en opnieuw proberen geeft vaak beter.)`)) return;
    const moved = haversine(st, { lat: c.latitude, lng: c.longitude });
    await sync.regie.upsertStop({ ...st, lat: +c.latitude.toFixed(7), lng: +c.longitude.toFixed(7) });
    toast(`📍 ${st.name} vastgelegd (±${Math.round(c.accuracy)} m, ${Math.round(moved)} m verschoven)`); audio.play('ok');
  } catch (e) { toast('⚠️ ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '📍 Hier'; setTimeout(() => { const l = $('#stoplist', o); if (l) l.innerHTML = stopRows(); }, 800); }
}
async function editStop(id, o) {
  const st = state.stop(id); if (!st) return;
  const name = prompt('Naam van de plek', st.name); if (name === null) return;
  const clue = prompt('Aanwijzing (wat de kinderen lezen om de plek te vinden)', st.clue); if (clue === null) return;
  try { await sync.regie.upsertStop({ ...st, name: name.trim() || st.name, clue: clue.trim() }); toast('✏️ Opgeslagen'); setTimeout(() => { const l = $('#stoplist', o); if (l) l.innerHTML = stopRows(); }, 800); }
  catch (e) { toast('⚠️ ' + e.message); }
}

/* ================================================================ GPS en aankomst */
let watchId = null, gpsError = '', lastDist = null, arriving = false;
const inGame = () => sync.isLoggedIn() && ['onderweg', 'puzzel', 'finale'].includes(S().game?.phase);
function startGps() {
  if (watchId != null || test) return;
  if (!navigator.geolocation) { gpsError = 'Deze telefoon geeft geen locatie door.'; return; }
  watchId = navigator.geolocation.watchPosition(p => {
    gpsError = ''; sync.setPos({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 30 }); checkArrival();
  }, e => {
    gpsError = e.code === 1 ? 'Locatie geweigerd. iPhone: Instellingen → Privacy → Locatievoorzieningen → Safari-websites → "Bij gebruik". Of tik op AA in de adresbalk → Website-instellingen → Locatie → Toestaan.' : 'GPS zoekt nog… loop even de open lucht in.';
    stopGps(); refresh(true);
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
}
function stopGps() { if (watchId != null) navigator.geolocation?.clearWatch(watchId); watchId = null; }
function checkArrival() {
  const st = state.activeStop(), pos = S().pos;
  if (!st || !pos || S().game?.phase !== 'onderweg' || arriving) return;
  if (haversine(pos, st) <= radiusOf(st) + Math.min(pos.acc || 0, 12)) arrive(st.id);
}
async function arrive(stopId = state.activeStop()?.id) {
  if (arriving || !stopId) return; arriving = true;
  try { await sync.arrive(stopId); } catch (e) { if (!/actieve stop|loopt niet/.test(e.message)) toast('⚠️ ' + e.message); }
  finally { setTimeout(() => arriving = false, 2500); }
}
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch {} }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (inGame()) keepAwake();
  if (booted) sync.reload().catch(() => {}); // iOS laat de websocket op de achtergrond vallen: stand opnieuw ophalen
});

/* ================================================================ kaart (js/map.js: wonderlandstijl, stroopspoor, avondkaart) */
const wmap = createMap(); // null zonder Leaflet
const hasL = !!wmap;
function updateMap(st, seesTarget) {
  if (!wmap || !st) return;
  const g = S().game, r = state.route();
  const found = r.slice(0, g?.active_index || 0).filter(x => x.part).map(x => ({ id: x.id, lat: x.lat, lng: x.lng, icon: PARTS[x.part]?.icon || '⭐' }));
  wmap.update({ stop: st, pos: test ? null : S().pos, gameKey: g?.started_at || 'x', seesTarget, found, meIds: S().device.players,
    players: S().players.map(p => ({ ...p, color: guard(p).color })) });
}
const fitMap = () => wmap?.fit();

/* ================================================================ schermen
   Elk scherm heeft een sleutel; verandert die, dan schuift een nieuw scherm in. Anders roept refresh() alleen update() aan. */
const screens = {};
let cur = { key: null }, booted = false, bootError = '', wantLogin = false;
function screenKey() {
  if (!booted) return 'boot';
  const g = S().game; if (!g) return 'boot';
  if (!sync.isLoggedIn() || wantLogin) return 'login';
  if (g.phase === 'lobby') return 'lobby';
  if (g.phase === 'klaar') return 'klaar';
  const st = state.activeStop(); if (!st) return 'lobby';
  return (g.phase === 'onderweg' ? 'nav:' : 'puz:') + st.id;
}
function mount(key) {
  cur.destroy?.();
  const [name, id] = key.split(':');
  const el = document.createElement('div'); el.className = 'scr slide-in'; // vers element per scherm: geen oude listeners
  $('#screen').replaceChildren(el);
  cur = { key, ...(screens[name](el, id) || {}) };
  placeMonster();
  scrollTo({ top: 0 });
}
let raf = 0;
function refresh(force) {
  if (raf && !force) return;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { raf = 0; const k = screenKey(); if (k !== cur.key || force === 'remount') mount(k); else cur.update?.(); placeMonster(); renderBar(); syncGps(); });
}
function syncGps() { if (inGame() && !test) startGps(); else if (!inGame()) stopGps(); if (inGame()) keepAwake(); }

/* ---------- balk */
const conn = c => `<svg class="conn" viewBox="0 0 16 20" aria-label="${c === 'online' ? 'verbonden' : 'geen verbinding'}"><path d="M8 1C5 6 2 9.5 2 13a6 6 0 0 0 12 0c0-3.5-3-7-6-12z" fill="${c === 'online' ? '#4ADE80' : c === 'connecting' ? '#F2BE62' : '#5B6680'}"/></svg>`;
function renderBar() {
  const g = S().game, me = state.me(), got = g?.parts || [];
  $('#bar').innerHTML = `<div class="in">
    <div class="chips">${me.map(p => { const x = guard(p); return `<span class="chip" style="--acc:${x.color}"><i>${x.icon}</i>${esc(p.name)}</span>`; }).join('') || '<span class="eyebrow">Mecha-Pof</span>'}</div>
    ${g && g.phase !== 'lobby' ? `<span class="drops" title="stroopdruppels">💧${g.drops || 0}</span>` : ''}
    ${conn(S().conn)}${sync.outboxSize() ? `<span class="note">${sync.outboxSize()}</span>` : ''}
    ${me.length && g ? (isSpeakerPhone() ? '<button class="iconbtn" data-b="walkie" aria-label="Walkietalkie met het monster">📻</button>' : `<span class="note" title="De walkietalkie zit op één telefoon per groep">📻 bij ${esc(speakerNames() || 'een ander')}</span>`) : ''}
    <button class="iconbtn" data-b="mute" aria-label="Geluid">${muted ? '🔇' : '🔊'}</button>
    <button class="iconbtn" data-b="tray" aria-label="Begeleider">⚙︎</button></div>
    ${g && g.phase !== 'lobby' ? `<div class="parts">${Object.keys(PARTS).map(k => `<span class="part ${got.includes(k) ? 'got' : ''}" title="${esc(PARTS[k].label)}">${got.includes(k) ? PARTS[k].icon : ''}</span>`).join('')}</div>` : ''}`;
}
$('#bar').addEventListener('click', e => {
  const b = e.target.closest('[data-b]')?.dataset.b;
  if (b === 'mute') { muted = !muted; store.set('pkm2_muted', muted); renderBar(); }
  if (b === 'tray') openTray();
  if (b === 'walkie') startWalkie();
});

/* ---------- boot */
screens.boot = el => {
  el.innerHTML = `<div class="center" style="margin-top:12vh">${mslot('md')}</div>
    <div class="page center"><span class="tab">Verbinden</span><p id="bootmsg">${bootError ? '⚠️ ' + esc(bootError) : 'Het dossier wordt opgehaald…'}</p>
    ${bootError ? '<button class="wide" id="retry">Opnieuw proberen</button>' : ''}</div>`;
  const r = $('#retry', el); if (r) r.onclick = () => { bootError = ''; refresh('remount'); boot(); };
};

/* ---------- login met de code van de uitnodiging */
screens.login = el => {
  const extra = sync.isLoggedIn();
  el.innerHTML = `${extra ? '' : `<div class="center"><span class="eyebrow">Het feest van ${esc(birthday()?.name || 'de jarige')}</span><h1>${esc(S().game?.title || 'Mecha-Pof')}</h1></div>${mslot('md')}`}
    <div class="page"><span class="tab">${extra ? 'Tweede bewaker' : 'Geheim dossier'}</span><span class="stamp">GEHEIM</span>
      <h2>${extra ? 'Wie loopt er met deze telefoon mee?' : 'Wie ben jij?'}</h2>
      <p>Tik de code van vier cijfers van je uitnodiging in.</p>
      <form class="row" autocomplete="off"><input class="big grow" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="code" aria-label="Code"><button class="ok" type="submit">Open</button></form>
      <p class="feedback"></p>
      ${extra ? '<button class="ghost" id="back">← Terug</button>' : '<p class="note">Geen eigen telefoon? Log in op die van een vriendin: één telefoon kan twee bewakers dragen.</p>'}
    </div>`;
  const inp = $('input', el), fb = $('.feedback', el);
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 4); if (inp.value.length === 4) $('form', el).requestSubmit(); });
  $('form', el).onsubmit = async e => {
    e.preventDefault(); if (inp.value.length !== 4) return; fb.textContent = 'Even kijken…';
    try {
      const res = await sync.login(inp.value); wantLogin = false; audio.play('login');
      if (res.mission) showMission(res.mission, res.player.name);
      refresh();
    } catch (err) { fb.textContent = err.code === 'offline' ? 'Geen verbinding. Probeer het zo nog eens.' : 'Die code kennen we niet. Kijk nog eens goed.'; inp.value = ''; buzz(120); }
  };
  const b = $('#back', el); if (b) b.onclick = () => { wantLogin = false; refresh(); };
  if (!('ontouchstart' in window)) inp.focus();
};

/* ---------- lobby: wie is er, wie ben jij */
screens.lobby = el => {
  el.innerHTML = `<div class="center"><span class="eyebrow">De bende van ${esc(birthday()?.name || 'de jarige')}</span><h1>Wachten op de start</h1></div>
    ${mslot('md')}<div id="mine"></div>
    <div class="page"><span class="tab">De bewakers</span><div class="guards" id="guards"></div>
      <p class="note center" id="lnote"></p></div>
    <div class="row"><button class="plain grow" id="add">+ Nog een bewaker op deze telefoon</button></div>`;
  $('#add', el).onclick = () => { wantLogin = true; refresh(); };
  el.addEventListener('click', e => { const id = e.target.closest('[data-out]')?.dataset.out; if (id && confirm('Afmelden op deze telefoon?')) { sync.logout(id); refresh(); } });
  const update = () => {
    const ps = S().players, mine = new Set(S().device.players);
    $('#mine', el).innerHTML = state.me().map(p => { const x = guard(p); return `<div class="page acc" style="--acc:${x.color}"><span class="tab">Jouw dossier</span>
      <div class="row"><span style="font-size:2.4rem">${x.icon}</span><div class="grow"><h2>${esc(p.name)}</h2>
      <p>${x.part ? 'Bewaker van ' + esc(PARTS[x.part].label) : 'Je deel wordt nog geloot…'}</p></div></div>
      ${x.talent ? `<div class="talent">Talent: <b>${esc(x.talent)}</b></div>` : ''}
      <button class="ghost" data-out="${p.id}">Afmelden op deze telefoon</button></div>`; }).join('');
    $('#guards', el).innerHTML = ps.map(p => { const x = guard(p); return `<div class="guard ${mine.has(p.id) ? 'mine' : ''}" style="--acc:${x.color}"><span class="ic">${x.icon}</span>
      <div><b>${esc(p.name)}<span class="dot ${p.online ? 'on' : ''}"></span></b><small>${esc(x.talent || 'nog geen talent')}</small></div></div>`; }).join('');
    const on = ps.filter(p => p.online).length;
    $('#lnote', el).textContent = `${on} van ${ps.length} online · ${state.phones()} telefoon${state.phones() > 1 ? 's' : ''}. De begeleider start het spel zodra iedereen er is.`;
  };
  update(); return { update };
};

/* ---------- onderweg naar de actieve stop */
screens.nav = (el, id) => {
  const st = state.stop(id), { n, total } = stopNo(st);
  lastDist = null;
  el.innerHTML = `${mslot('sm')}
    <div class="page"><span class="tab">${st.key === 'home' ? 'Laatste plek' : `Plek ${n} van ${total}`}</span>
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${PARTS[st.part]?.icon || ''} ${esc(PARTS[st.part]?.label || '')}</span></div>
      <h2>${esc(st.name)}</h2><p class="clue">${esc(st.clue)}</p>
      ${hasL ? '<div class="mapwrap"><div id="mapslot"></div><button class="mapbtn plain" id="fit" aria-label="Kaart centreren">🎯</button></div>' : ''}
      <div id="dist"></div><div class="meter" aria-hidden="true"><i></i></div>
      <p class="status" id="status"></p>
      <div id="navbtns" class="row"></div>
    </div>`;
  if (hasL) { $('#mapslot', el).appendChild(wmap.el); $('#fit', el).onclick = fitMap; }
  el.addEventListener('click', e => { const b = e.target.closest('[data-n]')?.dataset.n;
    if (b === 'tele') arrive(id); if (b === 'gps') { gpsError = ''; stopGps(); startGps(); update(); } });
  const update = () => {
    const pos = S().pos, r = radiusOf(st), kl = S().players.find(p => p.talent === 'kaartlezer');
    const seesMeters = !kl || state.hasTalent('kaartlezer');
    let dist = '…', pct = 0, warm = '', status = gpsError || (test ? 'Testmodus: geen GPS. Gebruik de teleportknop.' : 'GPS zoekt jullie positie…');
    if (pos && !test) {
      const d = haversine(pos, st); pct = Math.max(0, Math.min(100, 100 - ((d - r) / 300) * 100));
      warm = lastDist == null ? '' : d < lastDist - 1 ? '🔥 Warmer!' : d > lastDist + 1 ? '🧊 Kouder…' : ''; lastDist = d;
      dist = seesMeters ? Math.round(d) : '?';
      status = (d <= r + 30 ? 'Bijna! Nog een klein stukje.' : seesMeters ? 'Volg de stippellijn op de kaart.' : `Alleen ${esc(kl.name)} (Kaartlezer) ziet de meters. Vraag het haar!`) + ` · GPS ±${Math.round(pos.acc)} m`;
    }
    $('#dist', el).innerHTML = `<div class="dist">${dist}<small> m</small></div><div class="status">${warm}</div>`;
    $('.meter i', el).style.width = pct + '%';
    const s = $('#status', el); s.textContent = status; s.classList.toggle('bad', !!gpsError);
    $('#navbtns', el).innerHTML = (test ? '<button class="berry grow" data-n="tele">🛸 Teleporteer naar deze plek</button>' : '') + (gpsError ? '<button class="berry grow" data-n="gps">📡 Locatie opnieuw proberen</button>' : '');
    updateMap(st, seesMeters); checkArrival();
  };
  update(); return { update, destroy: () => wmap?.el.remove() };
};

/* ---------- puzzel bij de actieve stop (ook de finale thuis) */
const modCache = {};
const PUZZLE_V = 5; // ophogen bij wijzigingen in js/puzzles/
const loadPuzzle = type => modCache[type] ||= import(`./js/puzzles/${type}.js?v=${PUZZLE_V}`).then(m => m.default);
screens.puz = (el, id) => {
  const st = state.stop(id), { n, total } = stopNo(st);
  let mod = null, modErr = '', pending = [], sig = '', askedArrive = false, submitting = false;
  el.innerHTML = `${mslot('sm')}
    <div class="page"><span class="tab">📍 Jullie zijn er · ${st.key === 'home' ? 'Finale' : `plek ${n} van ${total}`}</span>
      <h2>${esc(st.name)}</h2>
      <div id="pz" class="col" style="display:flex;flex-direction:column;gap:12px"><p class="note">Puzzel wordt opengevouwen…</p></div>
      <div id="hintbox"></div><div id="submit" class="submit" hidden></div></div>`;
  const pz = $('#pz', el);
  let modType = null;
  const ps = () => { const p = S().puzzle; return p && p.stop_id === st.id ? p : null; };
  const config = p => (st.puzzles || [])[p?.variant ?? 0] || st.puzzles?.[0] || { type: 'opdracht', question: '' };
  const ctxOf = p => ({ seed: p.seed, variant: p.variant, players: S().players, phones: state.phones(),
    devices: [...new Set(S().players.filter(x => x.online && x.device_id).map(x => x.device_id))] });

  // Zet direct lokaal tonen (pending) en naar de server sturen; zodra de server hem terugstuurt valt hij uit pending.
  function move(m) {
    const id = Math.random().toString(36).slice(2, 10), mv = { ...m, id, by: state.me()[0]?.id };
    pending.push(mv); audio.play('plop'); buzz(15); update(true);
    sync.move({ ...m, id }, st.id).catch(e => { pending = pending.filter(x => x !== mv); toast('⚠️ ' + e.message); update(true); });
  }
  async function submit() {
    const p = ps(); if (!p || submitting) return; submitting = true; update(true);
    const fast = p.arrived_at && Date.now() - Date.parse(p.arrived_at) < 4 * 60_000;
    const drops = Math.max(2, 10 - 3 * (p.hints || 0)) + (fast ? 3 : 0);
    try { await sync.solve(drops, st.id); } catch (e) { toast('⚠️ ' + e.message); } finally { submitting = false; update(true); }
  }
  function update(force) {
    // Dit scherm hoort bij één stop; is die al afgerond, dan schuift refresh() zo het volgende scherm in.
    if (state.activeStop()?.id !== st.id || !['puzzel', 'finale'].includes(S().game?.phase)) return;
    const p = ps();
    if (!p) { if (!askedArrive && sync.isLoggedIn()) { askedArrive = true; arrive(st.id); } return; }
    const type = config(p).type;
    if (type !== modType) { modType = type; mod = null; modErr = '';
      loadPuzzle(type).then(m => { if (modType === type) { mod = m; update(true); } }).catch(() => { modErr = type; update(true); }); }
    if (modErr) { pz.innerHTML = `<p class="feedback">Puzzel "${esc(modErr)}" ontbreekt. Vraag de begeleider om de stop goed te keuren.</p>`; return; }
    if (!mod) return;
    pending = pending.filter(x => !p.moves.some(m => m.id === x.id));
    const cfg = config(p), ctx = ctxOf(p), moves = [...p.moves, ...pending];
    const s = [p.id, moves.length, p.hints, p.solved_at, ctx.phones, submitting, state.myTalents().join(), S().game?.settings?.any_can_submit, keyHolder()?.id].join('|');
    if (s === sig && !force) return; sig = s;
    let data; try { data = moves.reduce((d, m) => mod.reduce(d, m, ctx), mod.init(cfg, ctx)); }
    catch (e) { console.error(e); pz.innerHTML = '<p class="feedback">Deze puzzel struikelt. Vraag de begeleider.</p>'; return; }
    const solved = !!p.solved_at || mod.isSolved(data, cfg, ctx);
    mod.render(pz, data, { me: state.me(), talents: state.myTalents(), phones: ctx.phones, config: cfg, hints: p.hints, move, hint: () => sync.hint(st.id).catch(e => toast(e.message)), solve: submit });
    // hint: op elke telefoon zichtbaar zodra één bewaker hem vraagt
    $('#hintbox', el).innerHTML = !cfg.hint ? '' : p.hints > 0 ? `<div class="hint">💡 ${esc(cfg.hint)}</div>` : solved ? '' : '<button class="ghost" id="askhint">💡 Hint nodig? (kost stroopdruppels)</button>';
    const ah = $('#askhint', el); if (ah) ah.onclick = () => { if (confirm('Hint vragen? Dat kost de groep stroopdruppels.')) sync.hint(st.id).catch(e => toast(e.message)); };
    const sb = $('#submit', el); sb.hidden = !solved;
    if (solved) {
      const kh = keyHolder();
      sb.innerHTML = p.solved_at ? '<p class="feedback ok">✓ Ingediend!</p>'
        : canSubmit() ? `<p><b>Opgelost!</b> ${state.hasTalent('sleutelbewaarder') ? 'Jij bent de Sleutelbewaarder.' : ''} Dien het in om het deel te verdienen.</p><button class="ok wide big-btn" id="dosubmit" ${submitting ? 'disabled' : ''}>🔑 Indienen</button>`
        : kh ? `<p><b>Opgelost!</b> Alleen <b>${esc(kh.name)}</b>, de Sleutelbewaarder, kan het indienen. Roep haar!</p>`
        : '<p><b>Opgelost!</b> Er is nog geen Sleutelbewaarder. De begeleider keurt deze stop goed.</p>';
      const d = $('#dosubmit', el); if (d) d.onclick = submit;
    }
  }
  update(true);
  return { update: () => update(false), destroy: () => mod?.destroy?.(pz) };
};

/* ---------- klaar: monster compleet, eindcijfer als pannenkoekenstapel */
screens.klaar = el => {
  const g = S().game, stops = state.route().length || 7, b = birthday();
  const stack = Math.max(1, Math.min(10, Math.round((g.drops || 0) / (stops * 10) * 10)));
  el.innerHTML = `<div class="center"><span class="eyebrow">Dossier gesloten</span><h1>Mecha-Pof is compleet!</h1></div>
    ${mslot('lg')}
    <div class="page center"><span class="tab">Eindcijfer</span>
      <div class="stack">${Array.from({ length: stack }, (_, i) => `<i style="width:${150 - i * 6}px;animation-delay:${i * .12}s"></i>`).join('')}</div>
      <h2>${stack} van de 10 pannenkoeken hoog</h2>
      <p>${g.drops || 0} stroopdruppels · ${g.hints || 0} hint${g.hints === 1 ? '' : 's'}</p>
      ${b ? `<p class="clue">${esc(b.name)}, jij hebt de boterknop aangezet. Gefeliciteerd, jarige! Systeem: honger 100%… naar binnen, de pannenkoeken wachten!</p>` : '<p class="clue">Naar binnen: de pannenkoeken wachten!</p>'}
    </div>`;
};

/* ================================================================ start */
state.on('change', () => refresh());
async function boot() {
  try {
    await sync.connect();
    for (const e of S().events) seen.add(e.id);
    primed = true; booted = true; bootError = '';
  } catch (e) { bootError = e.message || 'Geen verbinding'; }
  refresh('remount');
}
window.pkm = { state, sync, router, PARTS, TALENTS, mon, monsterUrl, monsterImage, audio, toast, say, bubble, chime: audio.chime, buzz, refresh };
renderBar(); refresh('remount'); boot();
</script>
</body>
</html>
