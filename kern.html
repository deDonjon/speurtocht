<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0F18">
<title>Kern van Mecha-Pof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* kern.html — het kernscherm op de laptop thuis (chat 7, claude/ONBOARDING-FINALE.md §A en §C).
   Standen: slaap (lobby) → wakker (wekknop) → loting (roles.shuffle met loting:true) → onderweg (onderdelen vliegen in) → finale + eindscherm. */
:root{--bg:#0B0F18;--panel:#1A1F2A;--line:#3C4A66;--line2:#4E5D7E;--visor:#0E1B2E;--led:#7FE8FF;--led-dark:#15A4C8;--gold:#F2BE62;--gold-deep:#9A5419;--ink:#EAF2FF;--muted:#93A0B8;--straw:#FF5A4E;--ok:#4ADE80;--flame:#F59E2E;
  --display:'Lilita One','Arial Rounded MT Bold',sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;--hud:'Chakra Petch',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(60,74,102,.28) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(60,74,102,.28) 1px,transparent 1px) 0 0/48px 48px,radial-gradient(90% 80% at 50% 40%,#22304A 0%,var(--bg) 72%);transition:filter 1.2s}
body.slaap::before{filter:brightness(.45)}
button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:14px;min-height:52px;padding:10px 20px;color:#3A1C06;background:linear-gradient(180deg,#FCE3A6,var(--gold) 45%,#E0A548);box-shadow:0 4px 0 var(--gold-deep)}
button.plain{background:linear-gradient(180deg,#3A4356,#2A3142);color:var(--ink);border:2px solid var(--line2);box-shadow:0 3px 0 #10141C}
button:active{transform:translateY(3px);box-shadow:none}
input{font:inherit;font-family:var(--hud);font-size:1.4rem;color:var(--led);background:var(--visor);border:2px solid var(--led-dark);border-radius:12px;padding:10px 14px;min-height:52px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:2vw;padding:3vh 3vw}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-width:0}
#side{display:flex;flex-direction:column;justify-content:center;gap:2vh;min-width:0;overflow:auto}
.title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.4vw,4.2rem);color:var(--gold);text-shadow:0 4px 0 var(--gold-deep),0 0 30px rgba(242,190,98,.3);margin:0;line-height:1.05;text-align:center}
.eyebrow{font-family:var(--hud);letter-spacing:.2em;text-transform:uppercase;color:var(--led);font-size:clamp(.8rem,1.2vw,1.1rem);text-align:center}
.sub{color:var(--muted);font-size:clamp(1rem,1.6vw,1.4rem);text-align:center;max-width:42ch;margin:0 auto}
#mon .pkmon.lg{width:min(58vh,46vw,620px)}
#mon{position:relative}
#mon::after{content:'';position:absolute;left:10%;right:10%;bottom:2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(127,232,255,.28),transparent);z-index:-1}
body.slaap #mon::after{background:radial-gradient(closest-side,rgba(127,232,255,.07),transparent)}
.pkmon-bubble{font-size:clamp(1.15rem,1.9vw,1.75rem)!important;max-width:min(46vw,760px)!important;padding:16px 22px!important}
.panel{background:linear-gradient(160deg,#252C3A,var(--panel));border:2px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 6px 0 #070910,0 16px 34px rgba(0,0,0,.35)}
.panel h2{margin:0 0 10px;font-family:var(--hud);font-size:clamp(.85rem,1.2vw,1.05rem);letter-spacing:.16em;text-transform:uppercase;color:var(--led)}
/* standby-lampje */
.standby{display:flex;align-items:center;gap:12px;justify-content:center;font-family:var(--hud);letter-spacing:.2em;color:#4F6A8C;font-size:clamp(.9rem,1.4vw,1.2rem)}
.standby i{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:1}}
/* loting */
.reel{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;gap:12px;background:var(--visor);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:clamp(54px,8vh,82px)}
.slot b{font-size:clamp(1.2rem,2.2vw,2rem);font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .t{position:relative;overflow:hidden;height:clamp(34px,5vh,52px);border-radius:10px;background:#081220;border:2px solid var(--line2);font-family:var(--hud);font-size:clamp(1rem,1.8vw,1.6rem);color:var(--muted)}
.slot .t span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.slot.spin .t{border-color:var(--gold)}
.slot.spin .t span{animation:roll .12s linear infinite;color:var(--gold)}
@keyframes roll{from{transform:translateY(-60%);opacity:.3}50%{opacity:1}to{transform:translateY(60%);opacity:.3}}
.slot.lock{border-color:var(--acc,var(--led));box-shadow:0 0 18px color-mix(in srgb,var(--acc,var(--led)) 40%,transparent)}
.slot.lock .t{border-color:var(--acc,var(--led));color:#fff;animation:klik .35s}
@keyframes klik{0%{transform:scale(1.15)}100%{transform:none}}
.slot.vast::after{content:'🎂 vast';grid-column:2;justify-self:end;font-size:.75rem;color:var(--gold);font-family:var(--hud);margin-top:-6px}
/* onderweg */
.parts{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.part{aspect-ratio:1;border-radius:50%;background:var(--visor);border:2px dashed var(--line2);display:grid;place-items:center;font-size:clamp(1.2rem,2.4vw,2.2rem);opacity:.55}
.part.got{border:3px solid var(--led);box-shadow:0 0 16px rgba(127,232,255,.55);opacity:1}
.big{font-family:var(--hud);font-size:clamp(2rem,4vw,3.6rem);color:var(--led);text-shadow:0 0 16px rgba(127,232,255,.5);line-height:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
#gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(5,8,14,.94)}
#gate .panel{width:min(520px,90vw);display:flex;flex-direction:column;gap:14px;text-align:center}
#tools{position:fixed;right:14px;bottom:12px;display:flex;gap:8px;opacity:.25;transition:opacity .2s;z-index:70}
#tools:hover,#tools:focus-within{opacity:1}
#tools button{min-height:40px;padding:6px 12px;font-size:.85rem}
#conn{position:fixed;left:14px;bottom:12px;font-family:var(--hud);font-size:.75rem;color:var(--muted);letter-spacing:.1em}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:75}
@media (max-width:900px){#app{grid-template-columns:1fr;overflow:auto}html,body{overflow:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="slaap">
<div id="app"><section id="stage"><div class="eyebrow" id="eyebrow">Kern van Mecha-Pof</div><div id="mon"></div><div id="caption"></div></section><section id="side"></section></div>
<div id="gate"><div class="panel"><h2>Kern van Mecha-Pof</h2><p class="sub" id="gatemsg">Regiesleutel (één keer op deze laptop).</p>
  <form id="gateform" class="row" style="justify-content:center"><input type="password" id="key" placeholder="sleutel" aria-label="Regiesleutel" style="width:12em"><button type="submit">Aan</button></form>
  <p class="muted" id="gateerr"></p></div></div>
<div id="tools"><button class="plain" data-t="wake">⏻ Wakker</button><button class="plain" data-t="finale">▶ Finale</button><button class="plain" data-t="full">⛶ Volledig scherm</button></div>
<div id="conn"></div>
<canvas id="confetti" hidden></canvas>
<script type="module">
import { state, PARTS, TALENTS } from './js/state.js';
import { sync } from './js/sync.js';
import { createMonster, lineText } from './js/monster.js?v=14';
import { audio } from './js/audio.js?v=9';
import { voice } from './js/voice.js?v=3';
import { LINES } from './js/monster-lines.js?v=7';
import { createFinale, endCards, END_CSS, fillLine } from './js/finale.js?v=1';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = () => state.get();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = l => Array.isArray(l) && l.length ? l[Math.floor(Math.random() * l.length)] : null;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const KEY_REMEMBER = 'pkm2_regie_remember'; // zelfde als regie.html
document.head.insertAdjacentHTML('beforeend', `<style>${END_CSS} .fin-cards{grid-template-columns:repeat(2,minmax(0,1fr))} .fin-zin{font-size:clamp(.9rem,1.2vw,1.1rem)}</style>`);

/* ---------- monster: groot, praat altijd hardop (de kern is de luidspreker in huis) */
const mon = createMonster();
$('#mon').appendChild(mon.el); mon.setSize('lg'); mon.setParts([]); mon.setMood('slaap');
const say = (text, o = {}) => text ? mon.say(text, { voice: true, ...o }) : Promise.resolve(false);
function confetti() {
  const c = $('#confetti'), ctx = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ['#F2BE62', '#7FE8FF', '#FF5A4E', '#FFE98A', '#4ADE80'];
  const ps = Array.from({ length: 260 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height, r: 5 + Math.random() * 8, s: 2 + Math.random() * 4, c: cols[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let t = 0; const step = () => { ctx.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.s; p.a += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
    if (++t < 320) requestAnimationFrame(step); else c.hidden = true; }; requestAnimationFrame(step);
}
const finale = createFinale({ mon, state, audio, confetti, voice: () => true, key: 'pkm2_finale_kern', onStage: () => render() });

/* ---------- event-router (zelfde vorm als index.html, zodat monster.js meeluistert) */
const handlers = {}, seen = new Set(); let primed = false;
const router = {
  on(type, fn) { (handlers[type] ||= []).push(fn); return () => handlers[type] = handlers[type].filter(f => f !== fn); },
  dispatch(ev) { for (const fn of [...(handlers[ev.type] || []), ...(handlers['*'] || [])]) { try { fn(ev.payload || {}, ev); } catch (e) { console.error('[kern]', ev.type, e); } } },
};
state.on('event', ev => { if (!ev || seen.has(ev.id)) return; seen.add(ev.id); if (primed) router.dispatch(ev); });
window.pkm = { state, sync, router, mon, finale, audio, callRinging: () => false, PARTS, TALENTS };

/* ---------- stand bepalen */
let mode = 'slaap'; // slaap | wakker | loting | onderweg | klaar
let loting = null;  // { order:[{p, talent}], i, spinning }
const wokeSinceReset = () => { // wekzin na de laatste reset (events nieuwste eerst)
  for (const e of S().events) { if (e.type === 'game.reset') return false; if (e.type === 'monster.say' && e.payload?.wake) return true; }
  return false;
};
function modeFor() {
  const g = S().game; if (!g) return 'slaap';
  if (g.phase === 'klaar') return 'klaar';
  if (g.phase !== 'lobby') return 'onderweg';
  if (loting) return 'loting';
  return woke || wokeSinceReset() ? 'wakker' : 'slaap';
}
let woke = false;

/* ---------- tekenen */
const talentRow = p => { const t = TALENTS[p.talent], part = PARTS[t?.part];
  return `<div class="slot lock" style="--acc:${part?.color || '#7FE8FF'}"><b>${esc(p.name)}${p.is_birthday ? ' 🎂' : ''}</b><div class="t"><span>${part?.icon || '❔'} ${esc(t?.label || 'nog geen talent')}</span></div></div>`; };
function render() {
  const g = S().game, m = modeFor();
  if (m !== mode) { mode = m; document.body.classList.toggle('slaap', m === 'slaap'); }
  const parts = g?.parts || [];
  if (m === 'slaap') { mon.setMood('slaap'); mon.setParts([]); }
  else if (m === 'wakker' || m === 'loting') { if (mon.mood === 'slaap') mon.setMood('wakker'); }
  else if (m === 'onderweg' && !landing) { mon.setParts(parts); mon.setMood(parts.length <= 2 ? 'wakker' : parts.length <= 4 ? 'nieuwsgierig' : 'brutaal'); }
  const eb = $('#eyebrow'), cap = $('#caption'), side = $('#side');
  if (m === 'slaap') {
    eb.textContent = 'Hier rust de kern van Mecha-Pof';
    cap.innerHTML = `<div class="standby"><i></i>STAND-BY · PROCESSOR + RADIO</div>`;
    side.innerHTML = `<div class="panel"><h2>Noodsignaal</h2><p class="sub" style="text-align:left">Alleen mijn processor en mijn radio zijn thuis geland. De rest ligt ergens in de buurt…</p><p class="muted">Niet aanraken. Hij slaapt.</p></div>`;
  } else if (m === 'wakker') {
    eb.textContent = 'Kern van Mecha-Pof · online';
    cap.innerHTML = `<h1 class="title">Reparatieteam gezocht</h1>`;
    const ps = S().players;
    side.innerHTML = `<div class="panel"><h2>Monteurs</h2><div class="reel">${ps.map(p => p.talent ? talentRow(p) : `<div class="slot"><b>${esc(p.name)}${p.is_birthday ? ' 🎂' : ''}</b><div class="t"><span>? ? ?</span></div></div>`).join('')}</div></div>
      ${ps.some(p => p.talent) ? '<div class="panel"><h2>Voorstelronde</h2><p class="sub" style="text-align:left">Walkietalkie open. Om de beurt: je naam, en dan <b>over</b>. Mecha-Pof zegt wat jij voor hem doet.</p></div>' : ''}`;
  } else if (m === 'loting') {
    eb.textContent = 'Talentenmachine';
    cap.innerHTML = `<h1 class="title">De loting</h1>`;
    side.innerHTML = `<div class="panel"><h2>Wie wordt wat?</h2><div class="reel" id="reel">${loting.order.map((o, i) => `<div class="slot ${i < loting.i ? 'lock' : i === loting.i && loting.spinning ? 'spin' : ''} ${o.p.is_birthday ? 'vast' : ''}" style="--acc:${PARTS[TALENTS[o.talent]?.part]?.color || '#7FE8FF'}" data-i="${i}">
      <b>${esc(o.p.name)}${o.p.is_birthday ? ' 🎂' : ''}</b><div class="t"><span>${i < loting.i ? `${PARTS[TALENTS[o.talent].part].icon} ${esc(TALENTS[o.talent].label)}` : i === loting.i && loting.spinning ? `<span class="spinlabel"></span>` : '…'}</span></div></div>`).join('')}</div></div>`;
  } else if (m === 'onderweg') {
    const r = state.route(), act = state.activeStop(), done = r.slice(0, g.active_index).filter(s => s.part).length, total = r.filter(s => s.part).length;
    const mins = g.started_at ? Math.max(0, Math.round((Date.now() - Date.parse(g.started_at)) / 60000)) : 0;
    eb.textContent = 'Kern van Mecha-Pof · wacht op onderdelen';
    cap.innerHTML = `<h1 class="title">${parts.length} van 7</h1>`;
    side.innerHTML = `<div class="panel"><h2>Onderdelen</h2><div class="parts">${Object.keys(PARTS).map(k => `<div class="part ${parts.includes(k) ? 'got' : ''}" title="${esc(PARTS[k].label)}">${PARTS[k].icon}</div>`).join('')}</div></div>
      <div class="panel"><h2>Het team is bij</h2><p class="big">${esc(act?.name || '…')}</p><p class="muted">${g.phase === 'puzzel' || g.phase === 'finale' ? 'Ze zijn er en puzzelen.' : 'Onderweg.'} · plek ${Math.min(done + 1, total)} van ${total} · ${mins} min onderweg · 💧${g.drops || 0}</p></div>
      <div class="panel"><h2>Reparatieteam</h2><div class="reel">${S().players.map(talentRow).join('')}</div></div>`;
  } else if (m === 'klaar') {
    const showEnd = finale.stage === 'eind' || (finale.stage === 'idle' && finale.done);
    eb.textContent = 'MEGA-MECHA-POF';
    cap.innerHTML = `<h1 class="title">${finale.stage === 'idle' && !finale.done ? 'Alle zeven onderdelen!' : 'MEGA-MECHA-POF!'}</h1>`;
    side.innerHTML = showEnd ? `<div class="panel"><h2>Het Reparatieteam</h2><div class="fin-cards">${endCards(state)}</div></div>
        <div class="row" style="justify-content:center"><button data-t="foto">📸 Teamfoto</button></div>`
      : finale.stage === 'idle' ? `<div class="panel"><h2>Finale</h2><p class="sub" style="text-align:left">De boterknop zit erop. Klaar voor Mega-Mecha-Pof?</p><button data-t="finale">▶ Finale afspelen</button></div>`
      : `<div class="panel"><h2>Finale</h2><p class="big">${{ mega: 'Systeemcontrole…', vers: 'Verjaardagsvers', confetti: '🎉', finale: 'Compleet!' }[finale.stage] || ''}</p></div>`;
    if (finale.stage === 'idle' && !landing) { mon.setParts(Object.keys(PARTS)); mon.setMood('compleet'); }
  }
  $('#conn').textContent = `${S().conn} · ${g?.phase || '–'}`;
}
let landing = false;

/* ---------- wakker worden: wekknop in regie.html = monster.say { text: wekzin, wake: true, kern: true } */
async function wake(text) {
  woke = true; render();
  audio.play('start'); mon.setMood('wakker');
  await sleep(900);
  await say(text || pick(LINES.wek));
  await say(fillLine(pick(LINES.start), { jarige: S().players.find(p => p.is_birthday)?.name }));
  prewarmLoting();
}
function prewarmLoting() { // namen × talenten vooraf laten opnemen, zodat de loting niet hapert
  const ps = S().players, texts = [...(LINES.loting?.intro || []), ...(LINES.loting?.klaar || [])];
  for (const p of ps) for (const t of (p.is_birthday ? ['sleutelbewaarder'] : Object.keys(TALENTS).filter(x => x !== 'sleutelbewaarder'))) for (const l of LINES.loting?.[t] || []) texts.push(fillLine(l, { naam: p.name }));
  voice.prewarm?.(texts).catch?.(() => {});
}
router.on('monster.say', p => {
  if (p.wake) { wake(p.text); return; }
  if (mode !== 'onderweg') say(p.text || '…'); // tijdens het lopen praat de radiotelefoon; thuis de kern
});

/* ---------- loting: roles.shuffle met loting:true (regie.html → "Loting starten"); de jarige als laatste, zij staat vast */
router.on('roles.shuffle', async p => {
  if (!p.loting || loting) { render(); return; }
  const ps = S().players, tal = p.talents || {};
  const others = ps.filter(x => !x.is_birthday).sort(() => Math.random() - .5), bday = ps.filter(x => x.is_birthday);
  loting = { order: [...others, ...bday].map(x => ({ p: x, talent: tal[x.id] || x.talent })).filter(o => o.talent), i: 0, spinning: false };
  woke = true; render();
  await say(pick(LINES.loting?.intro));
  for (let i = 0; i < loting.order.length; i++) {
    loting.i = i; loting.spinning = true; render();
    const lab = () => document.querySelector(`#reel [data-i="${i}"] .spinlabel`);
    const keys = Object.keys(TALENTS); let k = 0;
    const spin = setInterval(() => { const el = lab(); if (el) el.textContent = `${PARTS[TALENTS[keys[k % 6]].part].icon} ${TALENTS[keys[k % 6]].label}`; k++; audio.play('tik'); }, 110);
    await sleep(loting.order[i].p.is_birthday ? 3400 : 2200);
    clearInterval(spin); loting.spinning = false; loting.i = i + 1; render();
    audio.play('vast');
    const o = loting.order[i];
    await say(fillLine(pick(LINES.loting?.[o.talent]), { naam: o.p.name }));
  }
  confetti(); audio.play('badge');
  await say(pick(LINES.loting?.klaar));
  loting = null; render();
});

/* ---------- start, onderdelen, finale */
router.on('game.start', async () => { woke = true; render(); await sleep(1200); say(pick(LINES.kern?.wacht)); });
router.on('game.reset', () => { woke = false; loting = null; finale.reset(); render(); });
router.on('stop.solved', p => {
  if (!p.part) { audio.play('ok'); return; } // bonusstop: geen onderdeel
  landing = true;
  const before = (S().game?.parts || []).filter(x => x !== p.part);
  mon.setParts(before); mon.setMood('nieuwsgierig');
  setTimeout(() => { mon.setParts([...before, p.part], { land: p.part }); audio.play('deel'); }, 600); // monster.js: invliegen, installatiezin (hardop), bij zeven delen de finale
  setTimeout(() => { landing = false; render(); }, 5000);
});
router.on('*', () => render());

/* ---------- knoppen (rechtsonder, half doorzichtig) */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-t]')?.dataset.t; if (!t) return;
  if (t === 'full') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} }
  if (t === 'wake') wake();
  if (t === 'finale') { finale.reset(); mon.setParts(Object.keys(PARTS)); finale.start(); }
  if (t === 'foto') { await say(pick(LINES.teamfoto)); confetti(); audio.play('klik'); }
});

/* ---------- kern meldt zich (telefoons zwijgen dan in de finale) */
async function heartbeat() { try { await sync.regie.patchGame({ settings: { kern_at: new Date().toISOString() } }); } catch (e) { console.warn('[kern] melden', e.message); } }

/* ---------- start */
async function gateOk() {
  $('#gate').hidden = true; audio.play('blip');
  heartbeat(); setInterval(heartbeat, 60_000);
  render(); setInterval(render, 30_000);
}
$('#gateform').onsubmit = async e => {
  e.preventDefault();
  try { await sync.regie.login($('#key').value.trim()); store.set(KEY_REMEMBER, $('#key').value.trim()); gateOk(); }
  catch (err) { $('#gateerr').textContent = err.message || 'Verkeerde sleutel'; }
};
async function boot() {
  try { await sync.connect(); for (const e of S().events) seen.add(e.id); primed = true; } catch (e) { $('#gatemsg').textContent = '⚠️ ' + (e.message || 'Geen verbinding'); return; }
  state.on('change', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); });
  const k = store.get(KEY_REMEMBER, null) || (sync.regie.restore() ? 'x' : null);
  if (k) { // sleutel bekend: één klik om het geluid te mogen aanzetten (browsers eisen een klik)
    if (k !== 'x') try { await sync.regie.login(k); } catch { return; }
    $('#gatemsg').textContent = 'Klik één keer, dan mag de kern geluid maken.';
    $('#gateform').innerHTML = '<button type="button" id="aan">🔊 Kern aanzetten</button>';
    $('#aan').onclick = gateOk;
  }
  render();
}
let raf = 0;
boot();
</script>
</body>
</html>
