<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kern van Mecha-Pof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">

<style>
/* kern.html — het kernscherm op de laptop thuis (chat 7, claude/ONBOARDING-FINALE.md §A en §C).
   Standen: slaap (lobby) → wakker (wekknop) → loting (roles.shuffle met loting:true) → onderweg (onderdelen vliegen in) → finale + eindscherm. */
:root{--bg:#0B0F18;--panel:#1A1F2A;--line:#3C4A66;--line2:#4E5D7E;--visor:#0E1B2E;--led:#7FE8FF;--led-dark:#15A4C8;--gold:#F2BE62;--gold-deep:#9A5419;--ink:#EAF2FF;--muted:#93A0B8;--straw:#FF5A4E;--ok:#4ADE80;--flame:#F59E2E;
  --display:'Lilita One','Arial Rounded MT Bold',sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;--hud:'Chakra Petch',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(60,74,102,.28) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(60,74,102,.28) 1px,transparent 1px) 0 0/48px 48px,radial-gradient(90% 80% at 50% 40%,#22304A 0%,var(--bg) 72%);transition:filter 1.2s}
body.slaap::before{filter:brightness(.45)}
button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:14px;min-height:52px;padding:10px 20px;color:#3A1C06;background:linear-gradient(180deg,#FCE3A6,var(--gold) 45%,#E0A548);box-shadow:0 4px 0 var(--gold-deep)}
button.plain{background:linear-gradient(180deg,#3A4356,#2A3142);color:var(--ink);border:2px solid var(--line2);box-shadow:0 3px 0 #10141C}
button:active{transform:translateY(3px);box-shadow:none}
input{font:inherit;font-family:var(--hud);font-size:1.4rem;color:var(--led);background:var(--visor);border:2px solid var(--led-dark);border-radius:12px;padding:10px 14px;min-height:52px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:2vw;padding:3vh 3vw}
body.klaar #app{grid-template-columns:minmax(0,.8fr) minmax(320px,1.35fr)}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;min-width:0}
#side{display:flex;flex-direction:column;justify-content:safe center;gap:2vh;min-width:0;overflow:auto;max-height:94vh}
.title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.4vw,4.2rem);color:var(--gold);text-shadow:0 4px 0 var(--gold-deep),0 0 30px rgba(242,190,98,.3);margin:0;line-height:1.05;text-align:center}
.eyebrow{font-family:var(--hud);letter-spacing:.2em;text-transform:uppercase;color:var(--led);font-size:clamp(.8rem,1.2vw,1.1rem);text-align:center}
.sub{color:var(--muted);font-size:clamp(1rem,1.6vw,1.4rem);text-align:center;max-width:42ch;margin:0 auto}
#mon .pkmon.lg{width:min(58vh,46vw,620px)}
#mon{position:relative}
#mon::after{content:'';position:absolute;left:10%;right:10%;bottom:2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(127,232,255,.28),transparent);z-index:-1}
body.slaap #mon::after{background:radial-gradient(closest-side,rgba(127,232,255,.07),transparent)}
.pkmon-bubble{font-size:clamp(1.15rem,1.9vw,1.75rem)!important;max-width:min(46vw,760px)!important;padding:16px 22px!important}
.panel{background:linear-gradient(160deg,#252C3A,var(--panel));border:2px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 6px 0 #070910,0 16px 34px rgba(0,0,0,.35)}
.panel h2{margin:0 0 10px;font-family:var(--hud);font-size:clamp(.85rem,1.2vw,1.05rem);letter-spacing:.16em;text-transform:uppercase;color:var(--led)}
/* standby-lampje */
.standby{display:flex;align-items:center;gap:12px;justify-content:center;font-family:var(--hud);letter-spacing:.2em;color:#4F6A8C;font-size:clamp(.9rem,1.4vw,1.2rem)}
.standby i{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:1}}
/* loting */
.reel{display:grid;gap:10px}
.slot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center;gap:12px;background:var(--visor);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:clamp(54px,8vh,82px)}
.slot b{font-size:clamp(1.2rem,2.2vw,2rem);font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .t{position:relative;overflow:hidden;height:clamp(34px,5vh,52px);border-radius:10px;background:#081220;border:2px solid var(--line2);font-family:var(--hud);font-size:clamp(.9rem,1.45vw,1.4rem);color:var(--muted)}
.slot .t span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.slot.spin .t{border-color:var(--gold)}
.slot.spin .t span{animation:roll .12s linear infinite;color:var(--gold)}
@keyframes roll{from{transform:translateY(-60%);opacity:.3}50%{opacity:1}to{transform:translateY(60%);opacity:.3}}
.slot.lock{border-color:var(--acc,var(--led));box-shadow:0 0 18px color-mix(in srgb,var(--acc,var(--led)) 40%,transparent)}
.slot.lock .t{border-color:var(--acc,var(--led));color:#fff;animation:klik .35s}
@keyframes klik{0%{transform:scale(1.15)}100%{transform:none}}
.slot.vast::after{content:'🎂 vast';grid-column:2;justify-self:end;font-size:.75rem;color:var(--gold);font-family:var(--hud);margin-top:-6px}
/* verhaal van Mecha-Pof (na de wekzin): één plaatje per zin */
.story{display:flex;flex-direction:column;gap:1.6vh;text-align:center}
.story h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3vw,2.9rem);color:var(--gold);line-height:1.08}
.story .sub{max-width:34ch}
.sdots{display:flex;gap:8px;justify-content:center}.sdots i{width:12px;height:12px;border-radius:50%;background:var(--line2)}.sdots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.svis{position:relative;display:grid;place-items:center;min-height:clamp(180px,36vh,360px)}
.svis img.pof{height:clamp(180px,36vh,360px);filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.feest{font-size:clamp(3rem,9vw,7rem);line-height:1}.feest b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5vw,4.6rem);color:var(--gold);text-shadow:0 4px 0 var(--gold-deep)}
.stroop{position:absolute;right:6%;top:8%;bottom:8%;width:26px;border-radius:14px;border:3px solid var(--line2);background:#081220;overflow:hidden}
.stroop i{position:absolute;left:0;right:0;bottom:0;height:8%;background:linear-gradient(180deg,var(--straw),var(--flame));animation:vol 15s ease-in forwards}
@keyframes vol{to{height:100%}}
.svis.boem img.pof{animation:boem .9s ease-in forwards}
@keyframes boem{0%{transform:none}20%{transform:rotate(-5deg) scale(1.06)}40%{transform:rotate(5deg) scale(1.12)}60%{transform:rotate(-7deg) scale(1.2);opacity:1}100%{transform:scale(2.2) rotate(12deg);opacity:0}}
.pofwoord{position:absolute;inset:0;display:none;place-items:center;font-family:var(--display);font-size:clamp(4rem,12vw,10rem);color:var(--straw);text-shadow:0 6px 0 #7A1B14,0 0 40px rgba(255,90,78,.6);transform:rotate(-8deg)}
.svis.boem .pofwoord{display:grid;animation:klik .4s .5s both}
.stukken{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.stuk{background:var(--visor);border:2px dashed var(--line2);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(.72rem,1vw,.95rem);color:var(--muted);line-height:1.15}
.stuk em{font-style:normal;font-size:clamp(1.6rem,3vw,2.6rem)}
.stuk.thuis{border:2px solid var(--ok);color:var(--ink);box-shadow:0 0 14px rgba(74,222,128,.35)}
.missie{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.missie div{background:var(--visor);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-size:clamp(.85rem,1.2vw,1.1rem);line-height:1.2}
.missie em{display:block;font-style:normal;font-size:clamp(2rem,4vw,3.4rem);margin-bottom:6px}
.missie div:last-child{border-color:var(--gold);box-shadow:0 0 18px rgba(242,190,98,.35)}
/* tijdens het verhaal en de speluitleg: geen tekstballon over de plaatjes, maar de zin als ondertitel onder Mecha-Pof */
body.verhaal .pkmon-bubble{display:none!important}
body.verhaal #mon .pkmon.lg{width:min(44vh,40vw,460px)}
body.breed #mon .pkmon.lg{width:min(40vh,30vw,400px)}
.zin{margin:0;max-width:34em;text-align:center;font-size:clamp(1rem,1.45vw,1.4rem);line-height:1.35;font-weight:800;color:var(--ink);background:rgba(14,27,46,.85);border:2px solid var(--led-dark);border-radius:16px;padding:12px 18px;box-shadow:0 0 18px rgba(127,232,255,.18)}
/* speluitleg: zeven stappen; bovenaan de stappen, daaronder het voorbeeld bij de actieve stap */
body.breed #app{grid-template-columns:minmax(0,.7fr) minmax(320px,1.3fr)}
.uitleg{display:flex;gap:8px;justify-content:center}
.ucard{display:grid;place-items:center;width:clamp(38px,4.4vw,58px);aspect-ratio:1;border-radius:50%;background:var(--visor);border:2px solid var(--line);opacity:.45;transition:opacity .3s,transform .3s,border-color .3s,box-shadow .3s}
.ucard em{font-style:normal;font-size:clamp(1.1rem,2vw,1.7rem);line-height:1}
.ucard.done{opacity:.8;border-color:var(--ok)}
.ucard.on{opacity:1;border-color:var(--gold);box-shadow:0 0 22px rgba(242,190,98,.45);transform:scale(1.15)}
.demo{display:flex;flex-direction:column;gap:1.6vh;text-align:center}
.demo h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,2.8vw,2.7rem);color:var(--gold);line-height:1.08}
.demo .sub{max-width:46ch}
.dvis{display:grid;place-items:center;min-height:clamp(220px,44vh,430px)}
.phones{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.4vw,20px);width:100%;align-items:start}
.phw{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.phw>b{font-size:clamp(.85rem,1.3vw,1.2rem);color:#fff;white-space:nowrap}
.ph{width:100%;max-width:230px;aspect-ratio:10/14;border-radius:22px;border:4px solid #55617C;background:#0B1220;box-shadow:0 8px 0 #070910,0 14px 26px rgba(0,0,0,.4);padding:10px 8px;display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:flex-start;overflow:hidden;transition:border-color .4s,box-shadow .4s}
.ph.xl{max-width:300px}
.ph.rol{justify-content:center;align-items:center}
.ph.rol em{font-style:normal;font-size:clamp(2.4rem,5vw,4.4rem);line-height:1}
.ph.rol b{font-family:var(--hud);letter-spacing:.08em;text-transform:uppercase;color:var(--led);font-size:clamp(.9rem,1.5vw,1.4rem)}
.ph.rol small{color:var(--muted);font-size:clamp(.7rem,1vw,.95rem);line-height:1.2;padding:0 4px}
.phr{display:flex;gap:5px;justify-content:center;align-items:center;font-family:var(--hud);font-size:clamp(.6rem,.9vw,.85rem);color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;white-space:nowrap}
.phr span{opacity:.55}.phr span.on{opacity:1;color:var(--led);font-weight:700;border:1px solid var(--led);border-radius:8px;padding:1px 5px;box-shadow:0 0 8px rgba(127,232,255,.4)}
.phk{font-family:var(--hud);font-size:clamp(.55rem,.8vw,.75rem);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pht{font-size:clamp(.7rem,1vw,.95rem);line-height:1.25;color:var(--ink)}
.phbig{font-family:var(--hud);font-size:clamp(1.8rem,3.6vw,3.2rem);color:var(--led);line-height:1;text-shadow:0 0 12px rgba(127,232,255,.5)}.phbig small{font-size:.4em;color:var(--muted)}
.phmeter{height:10px;border-radius:6px;background:#081220;border:1px solid var(--line2);overflow:hidden}.phmeter i{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--led-dark),var(--led));animation:warmer 3s ease-in-out infinite alternate}
@keyframes warmer{to{width:85%}}
.phbtn{border-radius:10px;padding:7px 6px;font-weight:900;font-size:clamp(.7rem,1vw,.95rem);color:#3A1C06;background:linear-gradient(180deg,#FCE3A6,var(--gold));box-shadow:0 3px 0 var(--gold-deep)}
.phbtn.ok{background:linear-gradient(180deg,#9AF0B8,var(--ok));box-shadow:0 3px 0 #1B7A3E}
.phbtn.grijs{background:#2A3142;color:var(--ink);box-shadow:0 3px 0 #10141C}
.phin{font-family:var(--hud);font-size:clamp(1rem,1.8vw,1.6rem);color:var(--led);background:var(--visor);border:2px solid var(--led-dark);border-radius:10px;padding:4px}
.phmsg{background:var(--visor);border:1px solid var(--line2);border-radius:10px;padding:6px 8px;text-align:left;font-size:clamp(.65rem,.95vw,.9rem);line-height:1.25}
.phzeg{border:2px solid var(--gold);border-radius:10px;padding:6px;color:var(--gold);font-size:clamp(.7rem,1vw,.95rem);line-height:1.2;box-shadow:0 0 14px rgba(242,190,98,.35);animation:breathe2 1.6s ease-in-out infinite}
.phzeg b{display:block;color:#fff;font-size:1.15em}
@keyframes breathe2{50%{box-shadow:0 0 26px rgba(242,190,98,.7)}}
.phbel{font-size:clamp(1.6rem,3vw,2.6rem);animation:bel .5s ease-in-out infinite alternate}@keyframes bel{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.duo{display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,28px);align-items:center;width:100%}
.duo .ph{width:clamp(150px,17vw,250px)}
.tips{display:flex;flex-direction:column;gap:10px;text-align:left}
.tip{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--visor);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:clamp(.85rem,1.25vw,1.15rem);line-height:1.2}
.tip em{font-style:normal;font-size:clamp(1.5rem,2.6vw,2.3rem)}
.tip b{display:block;color:#fff}
.route{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:clamp(1.4rem,2.6vw,2.4rem)}
.route span{display:grid;place-items:center;width:clamp(48px,5.4vw,76px);aspect-ratio:1;border-radius:50%;background:var(--visor);border:2px dashed var(--line2)}
.route span.huis{border:2px solid var(--gold)}
.route i{font-style:normal;color:var(--muted);font-size:.6em}
.reuze{font-size:clamp(4rem,11vw,9rem);line-height:1}
.schuif{font-family:var(--hud);color:var(--gold);font-size:clamp(.8rem,1.2vw,1.1rem);letter-spacing:.08em;margin-top:8px}
/* onderweg */
.parts{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.part{aspect-ratio:1;border-radius:50%;background:var(--visor);border:2px dashed var(--line2);display:grid;place-items:center;font-size:clamp(1.2rem,2.4vw,2.2rem);opacity:.55}
.part.got{border:3px solid var(--led);box-shadow:0 0 16px rgba(127,232,255,.55);opacity:1}
.big{font-family:var(--hud);font-size:clamp(2rem,4vw,3.6rem);color:var(--led);text-shadow:0 0 16px rgba(127,232,255,.5);line-height:1}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
#gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(5,8,14,.94)}
#gate .panel{width:min(520px,90vw);display:flex;flex-direction:column;gap:14px;text-align:center}
#tools{position:fixed;right:14px;bottom:12px;display:flex;gap:8px;opacity:.25;transition:opacity .2s;z-index:70}
#tools:hover,#tools:focus-within{opacity:1}
#tools button{min-height:40px;padding:6px 12px;font-size:.85rem}
#conn{position:fixed;left:14px;bottom:12px;font-family:var(--hud);font-size:.75rem;color:var(--muted);letter-spacing:.1em}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:75}
@media (max-width:900px){#app{grid-template-columns:1fr;overflow:auto}html,body{overflow:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.groot{position:fixed;inset:0;z-index:90;background:rgba(5,8,14,.96);display:grid;place-items:center;cursor:zoom-out}.groot img{max-width:100vw;max-height:100vh;object-fit:contain}
</style>
</head>
<body class="slaap">
<div id="app"><section id="stage"><div class="eyebrow" id="eyebrow">Kern van Mecha-Pof</div><div id="mon"></div><div id="caption"></div></section><section id="side"></section></div>
<div id="gate"><div class="panel"><h2>Kern van Mecha-Pof</h2><p class="sub" id="gatemsg">Regiesleutel (één keer op deze laptop).</p>
  <form id="gateform" class="row" style="justify-content:center"><input type="password" id="key" placeholder="sleutel" aria-label="Regiesleutel" style="width:12em"><button type="submit">Aan</button></form>
  <p class="muted" id="gateerr"></p></div></div>
<div id="tools"><button class="plain" data-t="wake">⏻ Wakker</button><button class="plain" data-t="uitleg">📋 Uitleg</button><button class="plain" data-t="finale">▶ Finale</button><button class="plain" data-t="full">⛶ Volledig scherm</button></div>
<div id="conn"></div>
<canvas id="confetti" hidden></canvas>
<script type="module">
import { state, PARTS, TALENTS } from './js/state.js';
import { sync, IS_TEST } from './js/sync.js';
import { createMonster, lineText, monsterImage } from './js/monster.js?v=26';
import { audio } from './js/audio.js?v=11';
import { voice } from './js/voice.js?v=7';
import { LINES } from './js/monster-lines.js?v=17';
import { createFinale, endCards, END_CSS, fillLine, stageHTML, TAART_HTML, buildHighlights } from './js/finale.js?v=14';
import { kernTekeningen } from './js/tekening.js?v=2'; // goedgekeurde tekeningen (regie → 📸 Tekeningen), 12 nov

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = () => state.get();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = l => Array.isArray(l) && l.length ? l[Math.floor(Math.random() * l.length)] : null;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const KEY_REMEMBER = 'pkm2_regie_remember' + (IS_TEST ? '_test' : ''); // zelfde als regie.html
document.head.insertAdjacentHTML('beforeend', `<style>${END_CSS} .fin-cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px} .fin-card{padding:10px} .fin-zin{font-size:clamp(.8rem,1vw,1rem)} .fin-head b{font-size:clamp(1rem,1.3vw,1.25rem)} .fin-ic{font-size:1.6rem} .fin-badge{font-size:.72rem}</style>`);

/* ---------- monster: groot, praat altijd hardop (de kern is de luidspreker in huis) */
const mon = createMonster();
$('#mon').appendChild(mon.el); mon.setSize('lg'); mon.setParts([]); mon.setMood('slaap');
const say = (text, o = {}) => text ? mon.say(text, { voice: true, ...o }) : Promise.resolve(false);
function confetti() {
  const c = $('#confetti'), ctx = c.getContext('2d'); c.hidden = false; c.width = innerWidth; c.height = innerHeight;
  const cols = ['#F2BE62', '#7FE8FF', '#FF5A4E', '#FFE98A', '#4ADE80'];

  const ps = S().players, jarige = ps.find(p => p.is_birthday)?.name;
  const texts = [...(LINES.wek || []), ...(LINES.intro || []), ...(LINES.loting?.intro || []), ...(LINES.loting?.klaar || []), ...(LINES.uitleg || []), ...(LINES.kern?.wacht || [])].map(l => fillLine(l, { jarige }));
  for (const p of ps) for (const t of (p.talent ? [p.talent] : p.is_birthday ? ['sleutelbewaarder'] : Object.keys(TALENTS).filter(x => x !== 'sleutelbewaarder'))) for (const l of LINES.loting?.[t] || []) texts.push(fillLine(l, { naam: p.name }));
  voice.prewarm?.(texts).catch?.(() => {});
}
async function speelUitleg() { // regie: knop "Speluitleg". Eén stap per zin, met een voorbeeld in beeld; daarna terug naar het wachtscherm.
  if (uitleg || loting || intro) return;
  woke = true; uitleg = { i: 0, k: 0 }; render();
  const zinnen = LINES.uitleg || [], J = { jarige: S().players.find(p => p.is_birthday)?.name };
  for (let i = 0; i < UITLEG.length && uitleg; i++) {
    const zin = zinnen[i] ? fillLine(zinnen[i], J) : UITLEG[i][1];
    uitleg.i = i; uitleg.k = 0; uitleg.zin = zin; render(); audio.play('plop');
    const schuif = i === 2 ? setInterval(() => { if (uitleg?.i === 2) { uitleg.k++; render(); audio.play('klik'); } }, 5000) : 0; // het doorschuiven laten zien
    await say(zin);
    clearInterval(schuif); await sleep(500);
  }
  if (uitleg) { confetti(); audio.play('badge'); }
  uitleg = null; render();
}
router.on('monster.say', p => {
  if (p.wake) { wake(p.text); return; }
  if (p.uitleg) { speelUitleg(); return; }
  if (mode !== 'onderweg') say(p.text || '…'); // tijdens het lopen praat de radiotelefoon; thuis de kern
});

/* ---------- loting: roles.shuffle met loting:true (regie.html → "Loting starten"); de jarige als laatste, zij staat vast */
router.on('roles.shuffle', async p => {
  if (!p.loting || loting || intro) { render(); return; }
  const ps = S().players, tal = p.talents || {};
  const others = ps.filter(x => !x.is_birthday).sort(() => Math.random() - .5), bday = ps.filter(x => x.is_birthday);
  loting = { order: [...others, ...bday].map(x => ({ p: x, talent: tal[x.id] || x.talent })).filter(o => o.talent), i: 0, spinning: false };
  woke = true; render();
  await say(pick(LINES.loting?.intro));
  for (let i = 0; i < loting.order.length; i++) {
    loting.i = i; loting.spinning = true; render();
    const lab = () => document.querySelector(`#reel [data-i="${i}"] .spinlabel`);
    const keys = Object.keys(TALENTS); let k = 0;
    const spin = setInterval(() => { const el = lab(); if (el) el.textContent = `${PARTS[TALENTS[keys[k % 6]].part].icon} ${TALENTS[keys[k % 6]].label}`; k++; audio.play('tik'); }, 110);
    await sleep(loting.order[i].p.is_birthday ? 3400 : 2200);
    clearInterval(spin); loting.spinning = false; loting.i = i + 1; render();
    audio.play('vast');
    const o = loting.order[i];
    await say(fillLine(pick(LINES.loting?.[o.talent]), { naam: o.p.name }));
  }
  confetti(); audio.play('badge');
  await say(pick(LINES.loting?.klaar));
  loting = null; render();
});

/* ---------- start, onderdelen, finale */
router.on('game.start', async () => { woke = true; uitleg = null; intro = null; render(); await sleep(1200); say(pick(LINES.kern?.wacht)); });
router.on('game.reset', () => { woke = false; loting = null; uitleg = null; intro = null; finale.reset(); render(); });
router.on('stop.solved', p => {
  if (!p.part) { audio.play('ok'); return; } // bonusstop: geen onderdeel
  landing = true;
  const before = (S().game?.parts || []).filter(x => x !== p.part);
  mon.setParts(before); mon.setMood('nieuwsgierig');
  setTimeout(() => { mon.setParts([...before, p.part], { land: p.part }); audio.play('deel'); }, 600); // monster.js: invliegen, installatiezin (hardop), bij zeven delen de finale
  setTimeout(() => { landing = false; render(); }, 5000);
});
router.on('*', () => render());

/* ---------- tekening groot (klik op een tekening; klik nog eens = terug) */
document.addEventListener('click', e => {
  const img = e.target.closest('img[data-groot]'); if (!img) return;
  const o = document.createElement('div'); o.className = 'groot'; o.innerHTML = `<img src="${esc(img.src)}" alt="">`;
  o.onclick = () => o.remove(); document.body.appendChild(o);
});
/* ---------- knoppen (rechtsonder, half doorzichtig) */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-t]')?.dataset.t; if (!t) return;
  if (t === 'full') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} }
  if (t === 'wake') wake();
  if (t === 'uitleg') speelUitleg();
  if (t === 'finale') { finale.reset(); mon.setParts(Object.keys(PARTS)); finale.start(); }
  if (t === 'foto') { await say(pick(LINES.teamfoto)); confetti(); audio.play('klik'); }
});

/* ---------- kern meldt zich (telefoons zwijgen dan in de finale) */
async function heartbeat() { if (PROEF) return; try { await sync.regie.patchGame({ settings: { kern_at: new Date().toISOString() } }); } catch (e) { console.warn('[kern] melden', e.message); } }

/* ---------- start */
async function gateOk() {
  $('#gate').hidden = true; audio.play('blip');
  heartbeat(); setInterval(heartbeat, 60_000);
  tek.start().then(() => { delete $('#side').dataset.sig; render(); });
  render(); setInterval(render, 30_000);
  if (!PROEF) prewarmThuis();
}
$('#gateform').onsubmit = async e => {
  e.preventDefault();
  try { await sync.regie.login($('#key').value.trim()); store.set(KEY_REMEMBER, $('#key').value.trim()); gateOk(); }
  catch (err) { $('#gateerr').textContent = err.message || 'Verkeerde sleutel'; }
};
async function boot() {
  try { await sync.connect(); for (const e of S().events) seen.add(e.id); primed = true; } catch (e) { $('#gatemsg').textContent = '⚠️ ' + (e.message || 'Geen verbinding'); return; }
  state.on('change', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); });
  const k = store.get(KEY_REMEMBER, null) || (sync.regie.restore() ? 'x' : null);
  if (k) { // sleutel bekend: één klik om het geluid te mogen aanzetten (browsers eisen een klik)
    if (k !== 'x') try { await sync.regie.login(k); } catch { return; }
    $('#gatemsg').textContent = 'Klik één keer, dan mag de kern geluid maken.';
    $('#gateform').innerHTML = '<button type="button" id="aan">🔊 Kern aanzetten</button>';
    $('#aan').onclick = gateOk;
  }
  render();
}
let raf = 0;
boot();
</script>
