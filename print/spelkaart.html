<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelkaart Operatie Mecha-Pof</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Getekende spelkaart op A4 (12 nov). Blad 1: de Monteurskaart voor de kinderen (signaalgebieden zonder nummers, afvinklijst).
   Blad 2: de Begeleiderskaart (genummerde route, richttijden, antwoorden) — NIET aan de kinderen geven.
   De lijn komt uit js/board-data.js (ROUTE); alles is met de hand "wiebelig" getekend in SVG, dus scherp op elke printer. */
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}html,body{margin:0}
body{background:#2A3142;font-family:'Nunito',system-ui,sans-serif;font-weight:800;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#141A26;color:#EAF2FF;font-size:14px}
.pbar span{color:#93A0B8;flex:1}.pbar button{font:inherit;font-weight:900;border:0;border-radius:10px;padding:8px 14px;background:#F2BE62;color:#3A1C06;cursor:pointer}
.sheet{width:210mm;height:297mm;margin:16px auto;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5);break-after:page;page-break-after:always;overflow:hidden;background:#F6E7C4}
.sheet svg{position:absolute;inset:0;width:100%;height:100%}
@media print{body{background:none}.pbar{display:none}.sheet{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="pbar"><b>Spelkaart</b><span>Blad 1: Monteurskaart voor de kinderen (per telefoon één, of één per kind). Blad 2: Begeleiderskaart met de antwoorden: alleen voor jou.</span><button onclick="print()">🖨️ Afdrukken</button></div>
<main id="sheets"></main>
<script type="module">
import { STOPS, DEEL, OX, OY, MAPW, MAPH, SC, INK, f, wobble, circ, pen, label, badge, signal, ico, seed, kaart } from './kaart.js';

/* ---------- blad: rand, titel, kompas, schaal, zijkolom */
function blad(gids) {
  seed(gids ? 5 : 3);
  const rand = wobble([[5, 5], [205, 5], [205, 292], [5, 292], [5, 5]], { amp: .5, step: 6 });
  const rand2 = wobble([[7.2, 7.2], [202.8, 7.2], [202.8, 289.8], [7.2, 289.8], [7.2, 7.2]], { amp: .4, step: 5 });
  const kader = wobble([[OX, OY], [OX + MAPW, OY], [OX + MAPW, OY + MAPH], [OX, OY + MAPH], [OX, OY]], { amp: .45, step: 5 });
  const CX = 180, kompas = `<g transform="translate(${CX} 60)"><path d="${circ(0, 0, 11, .3)}" fill="#FBF1D8" stroke="${INK}" stroke-width=".5"/><path d="M0 -15L2.6 0L0 15L-2.6 0z" fill="#B3261E" stroke="${INK}" stroke-width=".4"/><path d="M-15 0L0 -2.6L15 0L0 2.6z" fill="#F2BE62" stroke="${INK}" stroke-width=".4"/><circle r="1.3" fill="${INK}"/><text y="-17" text-anchor="middle" font-family="Lilita One" font-size="6" fill="${INK}">N</text></g>`;
  const schaal = `<g transform="translate(${OX + MAPW - 36} ${OY + MAPH - 6})"><path d="M0 0h${f(100 * SC)}M0 -1.4v2.8M${f(50 * SC)} -1v2M${f(100 * SC)} -1.4v2.8" ${pen(.5)}/>${label(100 * SC / 2, -2.4, '100 meter', { size: 2.6 })}</g>`;
  const vlekken = `<circle cx="38" cy="250" r="26" fill="#EAD3A0" opacity=".35"/><circle cx="170" cy="120" r="34" fill="#EAD3A0" opacity=".3"/><circle cx="120" cy="30" r="22" fill="#F1DDB2" opacity=".5"/>`;
  const kop = gids
    ? `<text x="11" y="21" font-family="Lilita One" font-size="11" fill="${INK}">Begeleiderskaart</text><text x="11" y="29.5" font-family="Chakra Petch" font-weight="700" font-size="3.4" letter-spacing=".6" fill="#B3261E">ALLEEN VOOR DE BEGELEIDER · MET ANTWOORDEN · NIET LATEN SLINGEREN</text><text x="11" y="35.5" font-family="Nunito" font-weight="800" font-size="3" fill="#7A4A2A">Route A · start 15:30 · thuis ±16:51 · finale ±17:00 (zon onder 16:55). Rode stippellijn = looproute.</text>`
    : `<text x="11" y="22" font-family="Lilita One" font-size="12.5" fill="${INK}">De kaart van Operatie Mecha-Pof</text><text x="11" y="30" font-family="Chakra Petch" font-weight="700" font-size="3.5" letter-spacing=".7" fill="#0E6F8A">STRIKT GEHEIM · EIGENDOM VAN REPARATIETEAM HANNAH 10</text><text x="11" y="36" font-family="Nunito" font-weight="800" font-size="3.1" fill="#7A4A2A">Bij de ontploffing vlogen mijn onderdelen alle kanten op. Waar het blauw gloeit, vang ik een signaal op. De volgorde? Luister naar de radio!</text>`;
  // zijkolom
  let col = '', y = 84;
  if (gids) {
    col += `<text x="157" y="${y}" font-family="Chakra Petch" font-weight="700" font-size="3" letter-spacing=".3" fill="${INK}">STOPS EN ANTWOORDEN</text>`; y += 5;
    for (const s of STOPS) { col += `${badge(160.2, y + 3.4, s.n).replace(/r="3.9"/, 'r="3.2"').replace(/font-size="5"/, 'font-size="4.2"').replace(`y="${f(y + 3.4 + 1.75)}"`, `y="${f(y + 3.4 + 1.5)}"`)}
      <text x="165" y="${y + 2.3}" font-family="Nunito" font-weight="900" font-size="2.7" fill="${INK}">${s.tijd} · ${s.naam}</text><text x="165" y="${y + 6}" font-family="Nunito" font-weight="800" font-size="2.7" fill="#B3261E">${s.antw}</text><text x="165" y="${y + 9.5}" font-family="Nunito" font-weight="700" font-size="2.5" fill="#7A4A2A">deel: ${DEEL[s.deel]}</text>`; y += 14.2; }
    y += 2;
    const regels = [['BONUS (alleen als je vóór ligt)', '#0E6F8A'], ['B1 steen bij stop 6: 1935', INK], ['B2 bankje: robotdans, afvinken', INK], ['B3 stalen huis: staal', INK], ['Reserve leeuwensteen: 1947', INK], ['', INK], ['VERRASSINGEN (regie start)', '#B3261E'], ['🍪 Kruimelaar: pad na stop 3', INK], ['📡 Dubbel signaal: Stadsbrink', INK], ['🔥 Jetpack-timer: na stop 6', INK], ['⚡ Kortsluiting: tankstation', INK], ['', INK], ['NOODKNOPPEN (regie)', '#B3261E'], ['GPS overslaan = aankomen', INK], ['Stop goedkeuren = opgelost', INK], ['Hint sturen · Plan B', INK]];
    for (const [t, c] of regels) { if (t) col += `<text x="157" y="${y}" font-family="${c === INK ? 'Nunito' : 'Chakra Petch'}" font-weight="${c === INK ? 800 : 700}" font-size="${c === INK ? 2.7 : 2.9}" fill="${c}">${t}</text>`; y += t ? 4.3 : 2; }
  } else {
    col += `<text x="160" y="${y}" font-family="Chakra Petch" font-weight="700" font-size="3.2" letter-spacing=".5" fill="${INK}">ONDERDELEN TERUG?</text><text x="160" y="${y + 4.4}" font-family="Nunito" font-weight="800" font-size="2.7" fill="#7A4A2A">Kruis aan wat vastzit!</text>`; y += 9;
    for (const d of Object.keys(DEEL)) { col += `<rect x="160" y="${y}" width="6" height="6" rx="1" fill="#FFFDF5" stroke="${INK}" stroke-width=".5"/>${ico(d, 168, y - 1.6, 9.2)}<text x="179" y="${y + 4.4}" font-family="Nunito" font-weight="900" font-size="3" fill="${INK}">${DEEL[d]}</text>`; y += 11.6; }
    y += 3;
    col += `<g>${signal(165, y + 4).replace(/font-size="4.8"/, 'font-size="4"')}</g><text x="175" y="${y + 2.6}" font-family="Nunito" font-weight="900" font-size="2.9" fill="${INK}">= signaal</text><text x="175" y="${y + 6.6}" font-family="Nunito" font-weight="800" font-size="2.6" fill="#7A4A2A">hier ligt iets!</text>`; y += 18;
    col += `<text x="160" y="${y}" font-family="Chakra Petch" font-weight="700" font-size="3.2" letter-spacing=".5" fill="${INK}">RADIOREGELS</text>`; y += 5;
    for (const t of ['1. Eindig met “over”.', '2. Klaar? “Over en', '    sluiten”.', '3. Niet verstaan?', '    Tik op ↻ HERHAAL.', '4. Blijf bij elkaar!']) { col += `<text x="160" y="${y}" font-family="Nunito" font-weight="800" font-size="2.9" fill="${INK}" xml:space="preserve">${t}</text>`; y += 4.4; }
    y += 5;
    col += `<text x="160" y="${y}" font-family="Chakra Petch" font-weight="700" font-size="3.2" letter-spacing=".5" fill="${INK}">ONS TEAM</text>`; y += 3;
    for (let i = 0; i < 6; i++) { y += 6.6; col += `<path d="M160 ${y}h39" ${pen(.35, '#7A4A2A')}/>`; }
  }
  return `<div class="sheet"><svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
    <rect width="210" height="297" fill="#F6E7C4"/>${vlekken}
    <path d="${rand}" ${pen(.9)}/><path d="${rand2}" ${pen(.35)}/>
    ${kop}
    <clipPath id="clip${gids ? 'g' : 'k'}"><rect x="${OX}" y="${OY}" width="${MAPW}" height="${MAPH}"/></clipPath>
    <rect x="${OX}" y="${OY}" width="${MAPW}" height="${MAPH}" fill="#F3E3BB"/>
    <g clip-path="url(#clip${gids ? 'g' : 'k'})">${kaart(gids)}</g>
    <path d="${kader}" ${pen(.8)}/>
    ${schaal}${kompas}${col}
    <text x="199" y="286.5" text-anchor="end" font-family="Chakra Petch" font-weight="700" font-size="2.4" letter-spacing=".4" fill="#9A7A55">${gids ? 'BEGELEIDER · VR 13 NOV 2026' : 'VR 13 NOV 2026 · KANAAL 07'}</text>
  </svg></div>`;
}
document.getElementById('sheets').innerHTML = blad(false) + blad(true);
await document.fonts.ready; window.__ready = true;
</script>
</body>
</html>
