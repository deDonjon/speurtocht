<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monteursdiploma</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Monteursdiploma A4 liggend, dubbelzijdig (12 nov). Voorkant: het diploma. Achterkant: Mecha-Pofs pannenkoekenrecept en de
   spelkaart met de gelopen route (aandenken, zonder antwoorden). Dubbelzijdig printen, omslaan over de KORTE zijde.
   Zonder ?wie: één blanco diploma (naam en talent met de hand). Met ?wie=Naam:talent,Naam:talent,…: per kind een ingevuld diploma. */
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}html,body{margin:0}
body{background:#2A3142;font-family:'Nunito',system-ui,sans-serif;font-weight:800;color:#2B1606;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#141A26;color:#EAF2FF;font-size:14px}
.pbar span{color:#93A0B8;flex:1}.pbar button{font:inherit;font-weight:900;border:0;border-radius:10px;padding:8px 14px;background:#F2BE62;color:#3A1C06;cursor:pointer}
.sheet{width:297mm;height:210mm;margin:16px auto;background:#FFF9EE;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden;break-after:page;page-break-after:always}
@media print{body{background:none}.pbar{display:none}.sheet{margin:0;box-shadow:none}}
.rand{position:absolute;inset:7mm;border:1.4mm solid #141A26;border-radius:5mm}
.rand::after{content:'';position:absolute;inset:1.6mm;border:.5mm solid #F2BE62;border-radius:3.6mm}
.streep{position:absolute;left:7mm;right:7mm;top:7mm;height:9mm;border-radius:5mm 5mm 0 0;background:repeating-linear-gradient(-45deg,#F2BE62 0 6mm,#141A26 6mm 12mm)}
.in{position:absolute;inset:22mm 16mm 13mm 16mm;display:grid;grid-template-columns:1fr 78mm;gap:8mm;align-items:center}
.eyebrow{font-family:'Chakra Petch',monospace;font-weight:700;font-size:4mm;letter-spacing:.24em;color:#0E6F8A}
h1{margin:1mm 0 3mm;font-family:'Lilita One',sans-serif;font-weight:400;font-size:25mm;line-height:.95;color:#141A26;text-shadow:0 1.1mm 0 #F2BE62}
p{margin:0;font-size:5.3mm;line-height:1.4}
.lijn{display:flex;align-items:flex-end;gap:4mm;margin:5mm 0 2mm;font-family:'Chakra Petch',monospace;font-weight:700;font-size:3.4mm;letter-spacing:.16em;color:#7A5A3A}
.lijn i{flex:1;border-bottom:.7mm solid #2B1606;height:15mm;font-style:normal;font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:.01em;color:#141A26;font-size:13mm;line-height:16mm;padding-left:2mm;white-space:nowrap}
.lijn.kort i{height:10mm;font-size:7mm;line-height:10.5mm;color:#0E6F8A}
.zin{font-size:4.7mm;color:#5A3A1A;margin-top:4mm}
.onder{display:flex;justify-content:space-between;align-items:flex-end;margin-top:7mm;font-family:'Chakra Petch',monospace;font-weight:700;font-size:3.1mm;letter-spacing:.14em;color:#7A5A3A}
.sig{font-family:'Lilita One',sans-serif;font-size:8mm;letter-spacing:0;color:#15A4C8;transform:rotate(-4deg);display:block;margin-bottom:3.5mm}
.stempel{width:32mm;height:32mm;flex:none;border-radius:50%;border:1.2mm solid #E0352B;color:#E0352B;display:grid;place-items:center;text-align:center;font-family:'Chakra Petch',monospace;font-weight:700;font-size:2.3mm;letter-spacing:.06em;line-height:1.3;transform:rotate(9deg);opacity:.9}
.stempel b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:6.4mm;letter-spacing:0}
.mon{background:radial-gradient(closest-side,#DDF6FD 0%,#FFF9EE 72%);border-radius:50%;aspect-ratio:1;display:grid;place-items:center}
.mon svg{width:100%;height:auto}
/* achterkant */
.rug{position:absolute;inset:12mm 13mm 11mm 14mm;display:grid;grid-template-columns:1fr 112mm;gap:9mm}
.recept{display:flex;flex-direction:column;gap:2.6mm}
.recept h2{margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:11.5mm;line-height:1;color:#141A26;text-shadow:0 .8mm 0 #F2BE62}
.recept .sub{font-size:3.9mm;color:#5A3A1A;line-height:1.3}
.recept h3{margin:1.4mm 0 0;font-family:'Chakra Petch',monospace;font-weight:700;font-size:3.3mm;letter-spacing:.18em;color:#0E6F8A}
.ingr{display:grid;grid-template-columns:1fr 1fr;gap:1.2mm 5mm;font-size:4.1mm}
.ingr span{border-bottom:.3mm dashed #C9A56E;padding-bottom:.6mm}
.ingr b{font-family:'Chakra Petch',monospace;font-weight:700;color:#B3261E}
.recept ol{margin:0;padding-left:5.6mm;font-size:3.95mm;line-height:1.34;display:flex;flex-direction:column;gap:1.1mm}
.recept ol li::marker{font-family:'Lilita One',sans-serif;color:#F59E2E;font-size:5mm}
.mega{background:#141A26;color:#EAF2FF;border-radius:3mm;padding:2.6mm 3.6mm;font-size:3.8mm;line-height:1.32}
.mega b{color:#F2BE62}
.veilig{font-size:3.3mm;color:#7A5A3A}
.kaartvak{display:flex;flex-direction:column;gap:2mm;min-height:0}
.kaartvak h3{margin:0;font-family:'Chakra Petch',monospace;font-weight:700;font-size:3.3mm;letter-spacing:.18em;color:#0E6F8A;text-align:center}
.kaartvak svg{flex:1;min-height:0;width:100%;border:.9mm solid #3B2A1A;border-radius:2.5mm;background:#F3E3BB}
.kaartvak small{font-size:3.1mm;color:#7A5A3A;text-align:center}
</style>
</head>
<body>
<div class="pbar"><b>Monteursdiploma</b><span>A4 liggend, dubbelzijdig (omslaan over de korte zijde): voorkant diploma, achterkant recept en spelkaart.</span><button onclick="print()">🖨️ Afdrukken</button></div>
<main id="sheets"></main>
<script type="module">
import { monsterSvg, TALENT_INFO } from './print.js';
import { kaart, seed, OX, OY, MAPW, MAPH } from './kaart.js';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wie = (new URLSearchParams(location.search).get('wie') || '').split(',').map(x => x.trim()).filter(Boolean).map(x => { const [naam, talent] = x.split(':'); return { naam, talent }; });
let mon = ''; try { mon = await monsterSvg(['lijf', 'ogen', 'neus', 'mond', 'armen', 'benen', 'hoed']); } catch (e) { console.warn(e); }

const voor = k => { const t = TALENT_INFO[k?.talent];
  return `<div class="sheet"><div class="rand"></div><div class="streep"></div><div class="in"><div>
    <div class="eyebrow">OPERATIE MECHA-POF · REPARATIETEAM HANNAH 10</div>
    <h1>Monteurs&shy;diploma</h1>
    <p>Hierbij verklaart keukenrobot <b>Mecha-Pof</b> dat</p>
    <div class="lijn">NAAM<i>${esc(k?.naam || '')}</i></div>
    <div class="lijn kort">TALENT<i>${t ? esc(t.label) + ' · monteur van ' + esc(t.deel) : ''}</i></div>
    <p class="zin">mij weer helemaal in elkaar heeft gezet: pantser, ogen, neus, mond, armen, benen en de boterknop. Zonder jou was ik nog steeds een pratend doosje met een stroopvlek. Bliep!</p>
    <div class="onder"><div><span class="sig">Mecha-Pof ⚡</span>HANDTEKENING VAN DE ROBOT · VEGHEL, 13 NOVEMBER 2026</div>
      <div class="stempel"><span>GOEDGEKEURD<b>MEGA</b>STROOPMETER VOL</span></div></div>
  </div><div class="mon">${mon}</div></div></div>`; };

seed(13);
const tekening = kaart(true, true); // aandenken: route en nummers, zonder tijden en antwoorden
const achter = `<div class="sheet"><div class="rand"></div><div class="rug">
  <div class="recept">
    <div class="eyebrow" style="font-size:3.3mm">GEHEIM RECEPT · UIT HET GEHEUGEN VAN MECHA-POF</div>
    <h2>Mecha-Pofs pannenkoeken (ontploffingsvrij)</h2>
    <p class="sub">Dit is het recept waarmee het allemaal begon. Deze keer zónder ontploffing. Genoeg voor ±12 pannenkoeken.</p>
    <h3>ONDERDELEN</h3>
    <div class="ingr"><span><b>250 g</b> bloem</span><span><b>500 ml</b> melk</span><span><b>2</b> eieren</span><span><b>1 snufje</b> zout</span><span><b>boter</b> om te bakken</span><span><b>stroop</b>, heel veel</span></div>
    <h3>MONTAGE</h3>
    <ol>
      <li>Doe de bloem en het zout in een grote kom. Maak een kuiltje in het midden.</li>
      <li>Breek de eieren in het kuiltje en giet er de helft van de melk bij. Klop met een garde tot een glad beslag. Geen klontjes: dat zijn storingen.</li>
      <li>Roer de rest van de melk erdoor. Laat het beslag 10 minuten opladen.</li>
      <li>Smelt een klontje boter in een hete koekenpan. Giet er een soeplepel beslag in en draai de pan rond.</li>
      <li>Bak tot de bovenkant droog is. Omdraaien met een spatel (of gooi hem op, als je durft). Nog één minuut.</li>
    </ol>
    <div class="mega"><b>MEGA-versie:</b> stapel vier pannenkoeken met stroop ertussen (mijn pantser), zet er een aardbei op (mijn neus) en twee bosbessen (mijn LED-ogen). Zeg “over en sluiten” en eet hem op.</div>
    <p class="veilig">Bakken doe je samen met een volwassene. De pan is heter dan mijn jetpack.</p>
  </div>
  <div class="kaartvak"><h3>DE ROUTE VAN ONS REPARATIETEAM</h3>
    <svg viewBox="${OX} ${OY} ${MAPW} ${MAPH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${tekening}</svg>
    <small>1 pantser · 2 ogen · 3 neus · 4 mond · 5 armen · 6 benen · 7 boterknop</small></div>
</div></div>`;
document.getElementById('sheets').innerHTML = (wie.length ? wie : [null]).map(k => voor(k) + achter).join('');
await document.fonts.ready; window.__ready = true;
</script>
</body>
</html>
